<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddle</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f7f5f0;
      color: #222;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .riddle {
      max-width: 34rem;
      font-size: clamp(1.15rem, 2.4vw, 1.6rem);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="riddle">
    No shore is near, no land in view—<br>
    seek the point that sailors eschew.<br>
    A captain’s name means “no one” here;<br>
    at desk Nemo the prize is near.<br>
    Room P-seven-dot-three, you see:<br>
    in the highest drawer your prize will be.
  </div>
</body>
</html>
