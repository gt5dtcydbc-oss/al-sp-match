<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice & Repeat Pro</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- UI Sidebar --- */
        .sidebar {
            width: 320px;
            background: #1e1e1e;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #333;
            overflow-y: auto;
            flex-shrink: 0;
        }

        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #fff; letter-spacing: 1px; }
        h2 { font-size: 0.8rem; text-transform: uppercase; color: #888; margin: 10px 0 0 0; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px;}

        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #ccc; }
        
        input[type="range"] { width: 100%; accent-color: #ff4757; cursor: pointer; }
        select { padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; outline: none; font-size: 0.9rem;}
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;}
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: #ff4757; cursor: pointer;}

        /* --- Custom File Upload --- */
        .custom-file-upload {
            padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px;
            cursor: pointer; font-weight: 600; transition: all 0.2s; text-align: center; width: 100%; font-size: 0.9rem; display: block;
        }
        .custom-file-upload:hover { background: #444; border-color: #555; }

        button {
            padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px;
            cursor: pointer; font-weight: 600; transition: all 0.2s; text-align: center; width: 100%; font-size: 0.9rem; font-family: inherit;
        }
        button:hover { background: #444; border-color: #555; }
        
        .primary-btn { background: #ff4757; border-color: #ff4757; color: white; margin-top: 10px; }
        .primary-btn:hover { background: #ff6b81; border-color: #ff6b81; }

        /* --- Canvas Area --- */
        .canvas-container {
            flex: 1; /* Takes up all remaining space */
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px; 
            background: #0a0a0a; 
            overflow: hidden;
            min-width: 0; /* Crucial for flexbox to not overflow */
        }

        canvas { 
            background-color: #2a2a2a; /* Visible background just in case */
            border: 1px dashed #555;
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid #333; }
            .canvas-container { height: 50vh; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- UI Controls -->
    <div class="sidebar">
        <h1>Slice & Repeat Pro</h1>
        
        <div class="control-group">
            <input type="file" id="imageLoader" accept="image/*" style="display: none;">
            <label for="imageLoader" class="custom-file-upload">Upload Your Image</label>
        </div>

        <h2>Grid Area</h2>
        <div class="control-group">
            <div class="control-header"><label>Columns</label><span id="colValue">5</span></div>
            <input type="range" id="colSlider" min="2" max="30" value="5" step="1">
        </div>
        <div class="control-group">
            <div class="control-header"><label>Rows</label><span id="rowValue">6</span></div>
            <input type="range" id="rowSlider" min="2" max="30" value="6" step="1">
        </div>
        <div class="control-group">
            <div class="control-header"><label>Area Width %</label><span id="widthValue">40</span></div>
            <input type="range" id="widthSlider" min="10" max="100" value="40" step="1">
        </div>
        <div class="control-group">
            <div class="control-header"><label>Area Height %</label><span id="heightValue">60</span></div>
            <input type="range" id="heightSlider" min="10" max="100" value="60" step="1">
        </div>

        <h2>Placement</h2>
        <div class="control-group">
            <div class="control-header"><label>Offset X</label><span id="offsetXValue">0</span></div>
            <input type="range" id="offsetXSlider" min="-50" max="50" value="0" step="1">
        </div>
        <div class="control-group">
            <div class="control-header"><label>Offset Y</label><span id="offsetYValue">0</span></div>
            <input type="range" id="offsetYSlider" min="-50" max="50" value="0" step="1">
        </div>

        <h2>Slice Logic</h2>
        <select id="patternSelect">
            <option value="random">Random Chaos</option>
            <option value="rowRepeat">Repeat Specific Row</option>
            <option value="colRepeat">Repeat Specific Column</option>
            <option value="hSmear">Horizontal Smear (Glitch)</option>
            <option value="vSmear">Vertical Smear (Glitch)</option>
            <option value="mirrorX">Mirror Horizontal (Kaleidoscope)</option>
            <option value="mirrorY">Mirror Vertical (Kaleidoscope)</option>
        </select>

        <div id="rowControl" class="control-group hidden">
            <div class="control-header"><label>Source Row</label><span id="srcRowValue">0</span></div>
            <input type="range" id="srcRowSlider" min="0" max="5" value="0" step="1">
        </div>
        <div id="colControl" class="control-group hidden">
            <div class="control-header"><label>Source Col</label><span id="srcColValue">0</span></div>
            <input type="range" id="srcColSlider" min="0" max="5" value="0" step="1">
        </div>

        <label class="checkbox-group" style="margin-top: 10px;">
            <input type="checkbox" id="showGrid"> Show Alignment Grid
        </label>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px;">
            <button id="randomizeBtn" class="primary-btn">Apply Effect</button>
            <button id="downloadBtn">Download Image</button>
        </div>
    </div>

    <!-- Visible Canvas -->
    <div class="canvas-container">
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Hidden Buffer Canvas to prevent browser rendering glitches
        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        // Inputs
        const imageLoader = document.getElementById('imageLoader');
        const colSlider = document.getElementById('colSlider');
        const rowSlider = document.getElementById('rowSlider');
        const widthSlider = document.getElementById('widthSlider');
        const heightSlider = document.getElementById('heightSlider');
        const offsetXSlider = document.getElementById('offsetXSlider');
        const offsetYSlider = document.getElementById('offsetYSlider');
        const patternSelect = document.getElementById('patternSelect');
        const showGridCheck = document.getElementById('showGrid');
        
        const rowControl = document.getElementById('rowControl');
        const colControl = document.getElementById('colControl');
        const srcRowSlider = document.getElementById('srcRowSlider');
        const srcColSlider = document.getElementById('srcColSlider');

        const labels = {
            col: document.getElementById('colValue'),
            row: document.getElementById('rowValue'),
            width: document.getElementById('widthValue'),
            height: document.getElementById('heightValue'),
            offX: document.getElementById('offsetXValue'),
            offY: document.getElementById('offsetYValue'),
            srcRow: document.getElementById('srcRowValue'),
            srcCol: document.getElementById('srcColValue')
        };

        let isImageLoaded = false;

        // --- 1. BULLETPROOF IMAGE LOADING ---
        function loadImageIntoBuffer(src) {
            const img = new Image();
            
            img.onload = () => {
                // Scale down massive images so the browser doesn't crash
                const MAX_SIZE = 2000; 
                let w = img.width;
                let h = img.height;
                
                if (w > MAX_SIZE || h > MAX_SIZE) {
                    const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
                    w = w * ratio;
                    h = h * ratio;
                }

                // Set both canvases to match the image size
                bufferCanvas.width = w;
                bufferCanvas.height = h;
                canvas.width = w;
                canvas.height = h;

                // Draw the image onto the hidden buffer canvas
                bufferCtx.drawImage(img, 0, 0, w, h);
                
                isImageLoaded = true;
                drawEffect();
            };

            img.onerror = () => {
                alert("There was an error loading this image. Please try a standard JPG or PNG.");
            };

            img.src = src;
        }

        // Create a guaranteed-to-work SVG placeholder locally (no internet needed)
        function loadDefaultImage() {
            const svgString = `
            <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
                <rect width="800" height="1000" fill="#1e1e1e"/>
                <circle cx="400" cy="400" r="180" fill="#ff4757"/>
                <rect x="150" y="700" width="500" height="120" fill="#1e90ff"/>
                <text x="50%" y="850" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="bold">Upload an Image</text>
            </svg>`;
            
            const blob = new Blob([svgString], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            loadImageIntoBuffer(url);
        }

        // Start with the placeholder
        loadDefaultImage();

        // --- 2. EVENT LISTENERS ---
        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadImageIntoBuffer(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function updateUI() {
            labels.col.textContent = colSlider.value;
            labels.row.textContent = rowSlider.value;
            labels.width.textContent = widthSlider.value;
            labels.height.textContent = heightSlider.value;
            labels.offX.textContent = offsetXSlider.value;
            labels.offY.textContent = offsetYSlider.value;
            
            srcRowSlider.max = parseInt(rowSlider.value) - 1;
            srcColSlider.max = parseInt(colSlider.value) - 1;
            if(parseInt(srcRowSlider.value) > parseInt(srcRowSlider.max)) srcRowSlider.value = srcRowSlider.max;
            if(parseInt(srcColSlider.value) > parseInt(srcColSlider.max)) srcColSlider.value = srcColSlider.max;
            
            labels.srcRow.textContent = srcRowSlider.value;
            labels.srcCol.textContent = srcColSlider.value;

            const pattern = patternSelect.value;
            rowControl.classList.toggle('hidden', pattern !== 'rowRepeat');
            colControl.classList.toggle('hidden', pattern !== 'colRepeat');
        }

        const allInputs = [colSlider, rowSlider, widthSlider, heightSlider, offsetXSlider, offsetYSlider, srcRowSlider, srcColSlider, patternSelect, showGridCheck];
        allInputs.forEach(input => {
            input.addEventListener('input', () => { 
                updateUI(); 
                if (isImageLoaded) drawEffect(); 
            });
        });

        document.getElementById('randomizeBtn').addEventListener('click', () => {
            if (isImageLoaded) drawEffect();
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!isImageLoaded) return;
            try {
                const link = document.createElement('a');
                link.download = 'slice_art.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert("Your browser blocked the download. Try uploading an image from your computer first.");
            }
        });

        // --- 3. DRAWING LOGIC ---
        function drawEffect() {
            if (!isImageLoaded) return;
            updateUI();

            // Clear the visible canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cols = parseInt(colSlider.value);
            const rows = parseInt(rowSlider.value);
            const widthPct = parseInt(widthSlider.value) / 100;
            const heightPct = parseInt(heightSlider.value) / 100;
            const offX = (parseInt(offsetXSlider.value) / 100) * canvas.width;
            const offY = (parseInt(offsetYSlider.value) / 100) * canvas.height;
            const pattern = patternSelect.value;

            const gridW = canvas.width * widthPct;
            const gridH = canvas.height * heightPct;
            const gridX = (canvas.width - gridW) / 2 + offX;
            const gridY = (canvas.height - gridH) / 2 + offY;
            const cellW = gridW / cols;
            const cellH = gridH / rows;

            // First, draw the untouched background image from the buffer
            ctx.drawImage(bufferCanvas, 0, 0);

            // Then, draw the slices on top
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    
                    const destX = gridX + (c * cellW);
                    const destY = gridY + (r * cellH);

                    let srcColIndex = c;
                    let srcRowIndex = r;

                    switch (pattern) {
                        case 'random':
                            srcColIndex = Math.floor(Math.random() * cols);
                            srcRowIndex = Math.floor(Math.random() * rows);
                            break;
                        case 'rowRepeat':
                            srcRowIndex = parseInt(srcRowSlider.value);
                            break;
                        case 'colRepeat':
                            srcColIndex = parseInt(srcColSlider.value);
                            break;
                        case 'hSmear':
                            let hShift = Math.floor(Math.random() * 5) - 2; 
                            srcColIndex = (c + hShift + cols) % cols;
                            break;
                        case 'vSmear':
                            let vShift = Math.floor(Math.random() * 5) - 2;
                            srcRowIndex = (r + vShift + rows) % rows;
                            break;
                        case 'mirrorX':
                            srcColIndex = (cols - 1) - c;
                            break;
                        case 'mirrorY':
                            srcRowIndex = (rows - 1) - r;
                            break;
                    }

                    const srcX = gridX + (srcColIndex * cellW);
                    const srcY = gridY + (srcRowIndex * cellH);

                    // Draw slice from Buffer Canvas to Visible Canvas
                    ctx.drawImage(bufferCanvas, srcX, srcY, cellW, cellH, destX, destY, cellW, cellH);
                }
            }

            // Draw Grid Overlay
            if (showGridCheck.checked) {
                ctx.strokeStyle = 'rgba(255, 71, 87, 0.6)'; 
                ctx.lineWidth = Math.max(1, canvas.width / 1000); 
                ctx.strokeRect(gridX, gridY, gridW, gridH);

                for (let c = 1; c < cols; c++) {
                    ctx.beginPath();
                    ctx.moveTo(gridX + c * cellW, gridY);
                    ctx.lineTo(gridX + c * cellW, gridY + gridH);
                    ctx.stroke();
                }
                for (let r = 1; r < rows; r++) {
                    ctx.beginPath();
                    ctx.moveTo(gridX, gridY + r * cellH);
                    ctx.lineTo(gridX + gridW, gridY + r * cellH);
                    ctx.stroke();
                }
            }
        }
    </script>
</body>
</html>
