<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Local Store Sign Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover { background-color: #555; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }

        /* The Sign Container */
        .sign-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        /* Image Area */
        .image-area {
            width: 100%;
            height: 350px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .placeholder-text { color: #aaa; font-size: 16px; }

        /* Typography Area - NO GAPS */
        .typography-area {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            background-color: #fff;
            gap: 0; /* Flush edges */
        }

        /* Text Blocks */
        .text-block {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            font-weight: 900;
            line-height: 1.1;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
            border-right: 1px solid rgba(0,0,0,0.1); /* Subtle divider if needed, or remove */
        }

        .text-block:active { transform: scale(0.95); }
        .text-block:hover { filter: brightness(0.9); }

        /* Grid Spans */
        .span-hero { grid-column: span 12; font-size: 56px; padding: 25px 8px; }
        .span-8 { grid-column: span 8; font-size: 42px; }
        .span-6 { grid-column: span 6; font-size: 36px; }
        .span-4 { grid-column: span 4; font-size: 24px; }
        .span-3 { grid-column: span 3; font-size: 20px; }
        
        /* Special Phone Number styles */
        .phone-horizontal {
            font-size: 16px;
            font-family: "Courier New", monospace;
            white-space: nowrap; /* PREVENTS BREAKING MID-NUMBER */
            letter-spacing: -0.5px;
        }

        .phone-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 18px;
            letter-spacing: 2px;
            font-family: "Courier New", monospace;
            white-space: nowrap;
            padding: 10px 0;
        }

        /* The Palette */
        .c-pale-green { background-color: #E6E8C8; color: #111; }
        .c-olive { background-color: #B0B880; color: #111; }
        .c-pale-pink { background-color: #E8C8C8; color: #111; }
        .c-beige { background-color: #E0D8C0; color: #111; }
        .c-periwinkle { background-color: #A0B0D0; color: #fff; }
        .c-dark-blue { background-color: #3A3A6A; color: #fff; }
        .c-lavender { background-color: #D0C8E0; color: #111; }
        .c-mint { background-color: #B0D8C8; color: #111; }
        .c-bright-blue { background-color: #0099FF; color: #fff; }
        .c-punch-red { background-color: #FF3366; color: #fff; }
        .c-mustard { background-color: #FFCC00; color: #111; }
        .c-coral { background-color: #CC3333; color: #fff; }
        .c-white { background-color: #FFF; color: #111; }
        .c-black { background-color: #111; color: #FFF; }

        .outlined-text { color: transparent; -webkit-text-stroke: 2px #111; }
        .outlined-text-white { color: transparent; -webkit-text-stroke: 2px #fff; }
    </style>
</head>
<body>

    <div class="controls">
        <label for="imageUpload" class="btn">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn btn-primary" onclick="generateSign()">2. Generate Layout</button>
        <button class="btn" onclick="downloadSign()">⬇️ Download</button>
    </div>

    <div class="sign-container" id="signContainer">
        <div class="image-area" id="imagePreview">
            <span class="placeholder-text">Image Preview</span>
        </div>
        <div class="typography-area" id="typographyArea"></div>
    </div>

    <script>
        const data = {
            names: ["果然好吃", "鲜果传奇", "沁心果香", "晨曦果园", "鲜到家", "果然生活", "丰收季", "万家果品", "栗语茶香", "板栗工坊"],
            slogans: ["十年老店", "颗颗饱满", "粒粒精选", "香糯可口", "这里的果子真甜", "十里飘香", "百里挑一", "香飘十里"],
            phones: ["199-3239-7640", "138-1506-6483", "177-6021-0449", "150-1513-3043", "139-8600-7681", "186-5899-6181"]
        };

        const colorClasses = [
            "c-pale-green", "c-olive", "c-pale-pink", "c-beige",
            "c-periwinkle", "c-dark-blue", "c-lavender", "c-mint",
            "c-bright-blue", "c-punch-red", "c-mustard", "c-coral",
            "c-white", "c-black"
        ];

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgArea = document.getElementById('imagePreview');
                    imgArea.innerHTML = `<img src="${event.target.result}" alt="Uploaded Image">`;
                }
                reader.readAsDataURL(file);
            }
        });

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Helper to create a block
        function createBlock(spanClass, isPhone, isVertical) {
            const block = document.createElement('div');
            block.classList.add('text-block', spanClass, getRandomItem(colorClasses));
            
            if (isPhone) {
                block.innerText = getRandomItem(data.phones);
                if (isVertical) {
                    block.classList.add('phone-vertical');
                } else {
                    block.classList.add('phone-horizontal');
                }
            } else {
                // Randomly pick name or slogan
                block.innerText = Math.random() > 0.5 ? getRandomItem(data.names) : getRandomItem(data.slogans);
                
                // Random outline
                if (Math.random() > 0.8) {
                    block.classList.add(Math.random() > 0.5 ? 'outlined-text' : 'outlined-text-white');
                }
            }

            // Click to reroll
            block.onclick = function() {
                this.parentNode.replaceChild(createBlock(spanClass, isPhone, isVertical), this);
            };

            return block;
        }

        function generateSign() {
            const container = document.getElementById('typographyArea');
            container.innerHTML = ''; 

            // Pre-defined row patterns that always add up to 12 columns
            // This guarantees NO GAPS.
            const rowPatterns = [
                [{span: 'span-hero', type: 'text'}],
                [{span: 'span-8', type: 'text'}, {span: 'span-4', type: 'text'}],
                [{span: 'span-4', type: 'phone'}, {span: 'span-8', type: 'text'}],
                [{span: 'span-6', type: 'text'}, {span: 'span-6', type: 'text'}],
                [{span: 'span-3', type: 'v-phone'}, {span: 'span-9', type: 'text'}], // Vertical phone + big text
                [{span: 'span-4', type: 'text'}, {span: 'span-4', type: 'text'}, {span: 'span-4', type: 'text'}],
                [{span: 'span-8', type: 'text'}, {span: 'span-4', type: 'phone'}],
                [{span: 'span-3', type: 'phone'}, {span: 'span-3', type: 'phone'}, {span: 'span-6', type: 'text'}]
            ];

            // Let's generate about 6 rows to make a long sign
            const numRows = 6;

            for (let i = 0; i < numRows; i++) {
                // Pick a random pattern
                const pattern = getRandomItem(rowPatterns);
                
                // Create blocks for that pattern
                pattern.forEach(item => {
                    const isPhone = item.type === 'phone' || item.type === 'v-phone';
                    const isVertical = item.type === 'v-phone';
                    container.appendChild(createBlock(item.span, isPhone, isVertical));
                });
            }
        }

        function downloadSign() {
            const element = document.getElementById('signContainer');
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'folk-sign.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }

        generateSign();
    </script>
</body>
</html>
