<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polished Folk Sign Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover { background-color: #555; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* The Sign Container */
        .sign-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        /* Image Area */
        .image-area {
            width: 100%;
            height: 350px;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #000;
        }

        .image-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .placeholder-text { color: #aaa; font-size: 16px; font-weight: bold; letter-spacing: 2px; }

        /* Typography Area - Strict Grid */
        .typography-area {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(80px, auto); /* Prevents row collapse */
            grid-auto-flow: dense; /* Fills gaps automatically */
            background-color: #000; /* Black background acts as grid borders */
            gap: 2px; /* Thickness of the border */
            min-height: 400px;
        }

        /* Text Blocks */
        .text-block {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", "Helvetica Neue", sans-serif;
            font-weight: 900;
            line-height: 1.1;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            background-color: #fff; 
        }

        .text-block:hover { filter: brightness(0.85); }

        /* Grid Spans */
        .span-12 { grid-column: span 12; font-size: clamp(36px, 8vw, 64px); padding: 20px; }
        .span-9 { grid-column: span 9; font-size: clamp(28px, 6vw, 52px); }
        .span-8 { grid-column: span 8; font-size: clamp(26px, 5vw, 48px); }
        .span-6 { grid-column: span 6; font-size: clamp(20px, 4vw, 36px); }
        .span-4 { grid-column: span 4; font-size: clamp(18px, 3vw, 24px); }
        .span-3 { grid-column: span 3; font-size: clamp(16px, 2.5vw, 20px); }

        /* Phone Number Styling */
        .phone-horizontal {
            font-family: "Courier New", monospace;
            font-weight: bold;
            white-space: nowrap; /* Forces it to one line */
            font-size: clamp(10px, 2vw, 18px); /* Shrinks if the box is too small */
            letter-spacing: -1px;
        }

        .phone-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: clamp(12px, 2vw, 18px);
            letter-spacing: 2px;
        }

        /* The Palette */
        .c-pale-green { background-color: #E6E8C8; color: #111; }
        .c-olive { background-color: #B0B880; color: #111; }
        .c-pale-pink { background-color: #E8C8C8; color: #111; }
        .c-beige { background-color: #E0D8C0; color: #111; }
        .c-periwinkle { background-color: #A0B0D0; color: #fff; }
        .c-dark-blue { background-color: #3A3A6A; color: #fff; }
        .c-lavender { background-color: #D0C8E0; color: #111; }
        .c-mint { background-color: #B0D8C8; color: #111; }
        .c-bright-blue { background-color: #0099FF; color: #fff; }
        .c-punch-red { background-color: #FF3366; color: #fff; }
        .c-mustard { background-color: #FFCC00; color: #111; }
        .c-coral { background-color: #CC3333; color: #fff; }
        .c-white { background-color: #FFF; color: #111; }
        .c-black { background-color: #111; color: #FFF; }

        /* Proper CSS Text Outline */
        .outlined-text {
            color: transparent;
            -webkit-text-stroke: 2px #111;
        }
        .outlined-text-white {
            color: transparent;
            -webkit-text-stroke: 2px #fff;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="imageUpload" class="btn">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn btn-primary" id="generateBtn" onclick="generateSign()" disabled>2. Generate Layout</button>
        <button class="btn" onclick="downloadSign()">⬇️ Download</button>
    </div>

    <div class="sign-container" id="signContainer">
        <div class="image-area" id="imagePreview">
            <span class="placeholder-text">NO IMAGE</span>
        </div>
        <div class="typography-area" id="typographyArea">
            <div style="grid-column: span 12; display: flex; justify-content: center; align-items: center; background: #fff; color: #333; font-weight: bold;">
                FETCHING WORDS...
            </div>
        </div>
    </div>

    <script>
        let dictionaryWords = [];
        let isLoaded = false;

        // Expanded fallback pool just in case
        const fallbackWords = ["果然好吃", "鲜果传奇", "沁心果香", "晨曦果园", "十年老店", "颗颗饱满", "十里飘香", "万家果品", "杂货百货", "日用批发", "便民服务", "老字号", "童叟无欺"];
        const phoneData = ["199-3239-7640", "138-1506-6483", "177-6021-0449", "150-1513-3043", "139-8600-7681", "186-5899-6181"];

        const colorClasses = [
            "c-pale-green", "c-olive", "c-pale-pink", "c-beige",
            "c-periwinkle", "c-dark-blue", "c-lavender", "c-mint",
            "c-bright-blue", "c-punch-red", "c-mustard", "c-coral",
            "c-white", "c-black"
        ];

        // --- INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Fetch 15 random words. Using allSettled prevents one failure from crashing the whole batch.
                const promises = Array.from({ length: 15 }, () => 
                    fetch('https://random-words-api.vercel.app/word/chinese')
                        .then(res => res.ok ? res.json() : null)
                        .then(data => data && data[0] ? data[0].word : null)
                        .catch(() => null) // Silently handle failed requests
                );
                
                const results = await Promise.allSettled(promises);
                
                // Extract valid words
                const words = results
                    .filter(r => r.status === 'fulfilled' && r.value !== null)
                    .map(r => r.value);

                // Filter: Only keep words that are 2, 3, or 4 characters long
                const validWords = words.filter(word => word.length >= 2 && word.length <= 4);
                
                // Use API words if we got at least 5, otherwise fallback
                dictionaryWords = validWords.length >= 5 ? validWords : fallbackWords;

                console.log(`API loaded. Using ${validWords.length} API words.`);
                
            } catch (error) {
                console.error("API Error. Using fallback.", error);
                dictionaryWords = fallbackWords;
            }

            isLoaded = true;
            document.getElementById('generateBtn').disabled = false;
            generateSign();
        });

        // --- IMAGE UPLOAD ---
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgArea = document.getElementById('imagePreview');
                    imgArea.innerHTML = `<img src="${event.target.result}" alt="Uploaded Image">`;
                }
                reader.readAsDataURL(file);
            }
        });

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // --- BLOCK GENERATOR ---
        function createBlock(spanClass, isPhone, isVertical) {
            const block = document.createElement('div');
            block.classList.add('text-block', spanClass, getRandomItem(colorClasses));
            
            if (isPhone) {
                block.innerText = getRandomItem(phoneData);
                if (isVertical) {
                    block.classList.add('phone-vertical');
                } else {
                    block.classList.add('phone-horizontal');
                }
            } else {
                block.innerText = getRandomItem(dictionaryWords);
                
                // Apply outline only to large blocks to prevent unreadable small text
                if (Math.random() > 0.8 && (spanClass === 'span-12' || spanClass === 'span-8' || spanClass === 'span-9')) {
                    // Check if background is light or dark to pick the right outline color
                    const bg = getRandomItem(colorClasses);
                    block.classList.remove(...colorClasses); // clear previous
                    block.classList.add(bg);
                    
                    if (bg.includes('dark') || bg.includes('black') || bg.includes('blue') || bg.includes('red')) {
                        block.classList.add('outlined-text-white');
                    } else {
                        block.classList.add('outlined-text');
                    }
                }
            }

            // Click to reroll
            block.onclick = function() {
                this.parentNode.replaceChild(createBlock(spanClass, isPhone, isVertical), this);
            };

            return block;
        }

        // --- MAIN GENERATOR ---
        function generateSign() {
            if (!isLoaded) return;

            const container = document.getElementById('typographyArea');
            container.innerHTML = ''; 

            // Every pattern strictly adds up to 12 columns
            const rowPatterns = [
                [{span: 'span-12', type: 'text'}],
                [{span: 'span-8', type: 'text'}, {span: 'span-4', type: 'text'}],
                [{span: 'span-4', type: 'text'}, {span: 'span-8', type: 'text'}],
                [{span: 'span-6', type: 'text'}, {span: 'span-6', type: 'text'}],
                [{span: 'span-4', type: 'text'}, {span: 'span-4', type: 'text'}, {span: 'span-4', type: 'text'}],
                [{span: 'span-3', type: 'v-phone'}, {span: 'span-9', type: 'text'}],
                [{span: 'span-9', type: 'text'}, {span: 'span-3', type: 'v-phone'}],
                [{span: 'span-8', type: 'text'}, {span: 'span-4', type: 'phone'}],
                [{span: 'span-4', type: 'phone'}, {span: 'span-8', type: 'text'}],
                [{span: 'span-4', type: 'phone'}, {span: 'span-4', type: 'text'}, {span: 'span-4', type: 'text'}]
            ];

            // Generate 8 rows
            for (let i = 0; i < 8; i++) {
                const pattern = getRandomItem(rowPatterns);
                
                pattern.forEach(item => {
                    const isPhone = item.type.includes('phone');
                    const isVertical = item.type === 'v-phone';
                    container.appendChild(createBlock(item.span, isPhone, isVertical));
                });
            }
        }

        // --- DOWNLOAD ---
        function downloadSign() {
            const element = document.getElementById('signContainer');
            
            // Temporarily disable click effects during capture to prevent visual glitches
            const blocks = document.querySelectorAll('.text-block');
            blocks.forEach(b => b.style.cursor = 'default');

            html2canvas(element, {
                scale: 2, // High resolution
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'folk-sign.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95); // Higher quality
                link.click();
                
                blocks.forEach(b => b.style.cursor = 'pointer');
            });
        }
    </script>
</body>
</html>
