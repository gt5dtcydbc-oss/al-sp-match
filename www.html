<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Local Store Sign Generator</title>
    <!-- Load html2canvas for the download feature -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover { background-color: #555; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }

        /* The Sign Container */
        .sign-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Image Area */
        .image-area {
            width: 100%;
            height: 350px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .placeholder-text { color: #aaa; font-size: 16px; }

        /* Typography Area - Now using CSS Grid for perfect tiling */
        .typography-area {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(40px, auto);
            grid-auto-flow: dense; /* This fills the gaps! */
            background-color: #000;
            gap: 1px; /* Tiny black line between blocks like a printed grid */
            padding: 1px;
        }

        /* Text Blocks */
        .text-block {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            font-weight: 900;
            line-height: 1.1;
            overflow: hidden;
            word-break: break-all;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .text-block:active { transform: scale(0.95); }
        .text-block:hover { filter: brightness(0.9); }

        /* Grid Spans (How many columns/rows they take up) */
        .span-hero { grid-column: span 12; font-size: 52px; padding: 20px 8px; }
        .span-large { grid-column: span 8; font-size: 38px; }
        .span-medium { grid-column: span 6; font-size: 28px; }
        .span-small { grid-column: span 4; font-size: 16px; font-family: "Courier New", monospace; }
        .span-vertical { grid-column: span 3; grid-row: span 2; writing-mode: vertical-rl; text-orientation: upright; font-size: 20px; letter-spacing: 2px;}

        /* The Palette */
        .c-pale-green { background-color: #E6E8C8; color: #111; }
        .c-olive { background-color: #B0B880; color: #111; }
        .c-pale-pink { background-color: #E8C8C8; color: #111; }
        .c-beige { background-color: #E0D8C0; color: #111; }
        .c-periwinkle { background-color: #A0B0D0; color: #fff; }
        .c-dark-blue { background-color: #3A3A6A; color: #fff; }
        .c-lavender { background-color: #D0C8E0; color: #111; }
        .c-mint { background-color: #B0D8C8; color: #111; }
        .c-bright-blue { background-color: #0099FF; color: #fff; }
        .c-punch-red { background-color: #FF3366; color: #fff; }
        .c-mustard { background-color: #FFCC00; color: #111; }
        .c-coral { background-color: #CC3333; color: #fff; }
        .c-white { background-color: #FFF; color: #111; }
        .c-black { background-color: #111; color: #FFF; }

        /* Special Typography Styles */
        .outlined-text {
            color: transparent;
            -webkit-text-stroke: 2px #111;
        }
        .outlined-text-white {
            color: transparent;
            -webkit-text-stroke: 2px #fff;
        }

    </style>
</head>
<body>

    <div class="controls">
        <label for="imageUpload" class="btn">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn btn-primary" onclick="generateSign()">2. Generate Layout</button>
        <button class="btn" onclick="downloadSign()">⬇️ Download</button>
    </div>

    <div class="sign-container" id="signContainer">
        <div class="image-area" id="imagePreview">
            <span class="placeholder-text">Image Preview</span>
        </div>
        <div class="typography-area" id="typographyArea"></div>
    </div>

    <script>
        // MOCK DATA
        const data = {
            names: ["果然好吃", "鲜果传奇", "沁心果香", "晨曦果园", "鲜到家", "果然生活", "丰收季", "万家果品", "栗语茶香", "板栗工坊"],
            slogans: ["十年老店", "颗颗饱满", "粒粒精选", "香糯可口", "这里的果子真甜", "十里飘香", "百里挑一", "香飘十里"],
            phones: ["199-3239-7640", "138-1506-6483", "177-6021-0449", "150-1513-3043", "139-8600-7681", "186-5899-6181"]
        };

        const colorClasses = [
            "c-pale-green", "c-olive", "c-pale-pink", "c-beige",
            "c-periwinkle", "c-dark-blue", "c-lavender", "c-mint",
            "c-bright-blue", "c-punch-red", "c-mustard", "c-coral",
            "c-white", "c-black"
        ];

        const sizeClasses = ["span-hero", "span-large", "span-medium", "span-small", "span-vertical"];

        // IMAGE UPLOAD
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgArea = document.getElementById('imagePreview');
                    imgArea.innerHTML = `<img src="${event.target.result}" alt="Uploaded Image">`;
                }
                reader.readAsDataURL(file);
            }
        });

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // CREATE A SINGLE BLOCK
        function createBlock() {
            const block = document.createElement('div');
            block.classList.add('text-block');
            
            // Randomize Color
            block.classList.add(getRandomItem(colorClasses));
            
            // Randomize Size/Layout
            let size = getRandomItem(sizeClasses);
            block.classList.add(size);

            // Randomize Content based on size
            if (size.includes('small') || size.includes('vertical')) {
                block.innerText = getRandomItem(data.phones);
            } else if (Math.random() > 0.5) {
                block.innerText = getRandomItem(data.names);
            } else {
                block.innerText = getRandomItem(data.slogans);
            }

            // Occasional outline effect
            if (Math.random() > 0.8) {
                block.classList.add(Math.random() > 0.5 ? 'outlined-text' : 'outlined-text-white');
            }

            // Click to reroll this specific block
            block.onclick = function() {
                const parent = this.parentNode;
                const newBlock = createBlock();
                parent.replaceChild(newBlock, this);
            };

            return block;
        }

        // GENERATE FULL SIGN
        function generateSign() {
            const container = document.getElementById('typographyArea');
            container.innerHTML = ''; 

            // Create roughly 15-20 blocks (CSS grid dense will pack them)
            for (let i = 0; i < 18; i++) {
                container.appendChild(createBlock());
            }
        }

        // DOWNLOAD AS IMAGE
        function downloadSign() {
            const element = document.getElementById('signContainer');
            
            // html2canvas takes a snapshot of the DOM
            html2canvas(element, {
                scale: 2, // High resolution
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                // Create a temporary link to trigger download
                const link = document.createElement('a');
                link.download = 'my-folk-sign.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }

        // Generate on load
        generateSign();
    </script>
</body>
</html>
