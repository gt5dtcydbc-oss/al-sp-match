<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Color Tracery Connector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 1100px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
        }
        label {
            font-size: 12px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="file"], select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #a6a6a2;
        }
        
        button {
            background: #a6a6a2;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #8c8c88; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        #processBtn {
            padding: 12px 24px;
            margin-top: 24px;
            width: 100%;
        }

        #addColorBtn {
            background: #444;
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 5px;
            width: fit-content;
        }
        #addColorBtn:hover { background: #555; }

        #status {
            font-size: 13px;
            color: #ffd700;
            margin-top: 10px;
            height: 15px;
        }
        .canvas-container {
            position: relative;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            overflow: auto;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        .color-pickers {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        input[type="color"] {
            background: none;
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            padding: 0;
        }
        .remove-color {
            background: #333;
            color: #ff4444;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }
        .remove-color:hover {
            background: #555;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            cursor: pointer;
        }
        .toggle-group input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>1. Upload Image</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        
        <div class="control-group" style="min-width: 180px;">
            <label>2. Target Colors</label>
            <div id="colorPickers" class="color-pickers"></div>
            <button id="addColorBtn">+ Add Color</button>
        </div>

        <div class="control-group">
            <label>3. Detection Settings</label>
            <label>Tolerance: <span id="tolVal">40</span></label>
            <input type="range" id="tolerance" min="5" max="150" value="40">
            
            <label>Min Blob Size: <span id="sizeVal">50</span>px</label>
            <input type="range" id="minSize" min="10" max="500" value="50">
            
            <label style="margin-top:5px;">Shape Style</label>
            <select id="shapeStyle">
                <option value="circle">Circle</option>
                <option value="square">Square</option>
            </select>
        </div>

        <div class="control-group">
            <label>4. Drawing Settings</label>
            
            <label style="margin-top:5px;">Connecting Lines</label>
            <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="connectLines" checked> Enable Lines
            </label>
            
            <select id="lineStyle" style="margin-bottom: 10px;">
                <option value="solid">Solid Line</option>
                <option value="dashed">Dashed Line</option>
            </select>

            <label style="margin-top:5px;">Shape Fill</label>
            <label class="toggle-group">
                <input type="checkbox" id="solidFillToggle"> Solid Fill (Keying)
            </label>
            <input type="color" id="fillColor" value="#ffffff" style="display: none; margin-top: 5px;">
        </div>

        <div class="control-group" style="justify-content: flex-end; flex-grow: 1;">
            <button id="processBtn">Process Image</button>
            <span id="status"></span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const processBtn = document.getElementById('processBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        
        const toleranceSlider = document.getElementById('tolerance');
        const minSizeSlider = document.getElementById('minSize');
        const shapeStyle = document.getElementById('shapeStyle');
        const connectLines = document.getElementById('connectLines');
        const lineStyle = document.getElementById('lineStyle');
        
        const solidFillToggle = document.getElementById('solidFillToggle');
        const fillColorPicker = document.getElementById('fillColor');
        
        const tolVal = document.getElementById('tolVal');
        const sizeVal = document.getElementById('sizeVal');

        let uploadedImage = new Image();
        let currentImageLoaded = false;
        
        let activeColors = [
            { hex: '#ff0000' }
        ];

        // --- UI Setup ---
        toleranceSlider.addEventListener('input', (e) => tolVal.innerText = e.target.value);
        minSizeSlider.addEventListener('input', (e) => sizeVal.innerText = e.target.value);

        // Show/hide the fill color picker based on the toggle
        solidFillToggle.addEventListener('change', (e) => {
            fillColorPicker.style.display = e.target.checked ? 'block' : 'none';
        });

        function renderColorPickers() {
            const container = document.getElementById('colorPickers');
            container.innerHTML = '';
            
            activeColors.forEach((colorObj, index) => {
                const row = document.createElement('div');
                row.className = 'color-row';
                
                const input = document.createElement('input');
                input.type = 'color';
                input.value = colorObj.hex;
                input.addEventListener('input', (e) => {
                    activeColors[index].hex = e.target.value;
                });
                
                row.appendChild(input);

                if (activeColors.length > 1) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-color';
                    removeBtn.innerText = '✕';
                    removeBtn.title = "Remove Color";
                    removeBtn.onclick = () => {
                        activeColors.splice(index, 1);
                        renderColorPickers();
                    };
                    row.appendChild(removeBtn);
                }
                
                container.appendChild(row);
            });
        }

        renderColorPickers();

        document.getElementById('addColorBtn').addEventListener('click', () => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            activeColors.push({ hex: randomColor });
            renderColorPickers();
        });


        // --- Image Loading ---
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedImage.onload = () => {
                    canvas.width = uploadedImage.width;
                    canvas.height = uploadedImage.height;
                    ctx.drawImage(uploadedImage, 0, 0);
                    currentImageLoaded = true;
                    statusText.innerText = "Image loaded. Ready.";
                    statusText.style.color = "#00ff00";
                };
                uploadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- Color Distance Algorithm ---
        function colorDistance(r1, g1, b1, r2, g2, b2) {
            return Math.sqrt(Math.pow(r1 - r2, 2) + Math.pow(g1 - g2, 2) + Math.pow(b1 - b2, 2));
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // --- Nearest Neighbor Sorting ---
        function sortNearestNeighbor(points) {
            if (points.length < 2) return points;
            let unvisited = [...points];
            let sorted = [];
            
            unvisited.sort((a, b) => a.y - b.y || a.x - b.x);
            let current = unvisited.shift();
            sorted.push(current);

            while (unvisited.length > 0) {
                let nearestIdx = 0;
                let minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    let dist = Math.hypot(current.x - unvisited[i].x, current.y - unvisited[i].y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }
                current = unvisited[nearestIdx];
                sorted.push(current);
                unvisited.splice(nearestIdx, 1);
            }
            return sorted;
        }

        // --- Main Process ---
        processBtn.addEventListener('click', async () => {
            if (!currentImageLoaded) {
                alert("Please upload an image first!");
                return;
            }

            const tolerance = parseInt(toleranceSlider.value);
            const minSize = parseInt(minSizeSlider.value);
            const style = shapeStyle.value;
            const doConnect = connectLines.checked;
            const lineType = lineStyle.value;
            
            const doSolidFill = solidFillToggle.checked;
            const fillColorValue = fillColorPicker.value;

            processBtn.disabled = true;
            statusText.innerText = "Scanning image pixels...";
            statusText.style.color = "#ffd700";

            setTimeout(() => {
                ctx.drawImage(uploadedImage, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const width = canvas.width;
                const height = canvas.height;

                const visited = new Uint8Array(width * height);
                let totalBlobsFound = 0;

                // Default blend mode for ink effects
                ctx.globalCompositeOperation = 'multiply';
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                for (let c = 0; c < activeColors.length; c++) {
                    const targetRgb = hexToRgb(activeColors[c].hex);
                    const targetHex = activeColors[c].hex;
                    
                    const blobs = [];

                    for (let y = 0; y < height; y+=2) { 
                        for (let x = 0; x < width; x+=2) {
                            const idx = (y * width + x) * 4;
                            const pVisitedIdx = y * width + x;

                            if (visited[pVisitedIdx]) continue;

                            const r = data[idx];
                            const g = data[idx + 1];
                            const b = data[idx + 2];
                            const a = data[idx + 3];

                            if (a < 50) continue;

                            if (colorDistance(r, g, b, targetRgb.r, targetRgb.g, targetRgb.b) <= tolerance) {
                                const blob = floodFill(x, y, targetRgb, tolerance, data, width, height, visited);
                                if (blob.pixelCount > minSize) {
                                    blobs.push(blob);
                                }
                            }
                        }
                    }

                    totalBlobsFound += blobs.length;

                    if (blobs.length > 0) {
                        const centers = [];

                        // Step 1: Draw all shapes (with either transparent or solid fill)
                        blobs.forEach(blob => {
                            const centerX = (blob.minX + blob.maxX) / 2;
                            const centerY = (blob.minY + blob.maxY) / 2;
                            centers.push({ x: centerX, y: centerY });

                            // Handle Fill
                            if (doSolidFill) {
                                ctx.globalCompositeOperation = 'source-over'; // Opaque overlay
                                ctx.fillStyle = fillColorValue;
                            } else {
                                ctx.globalCompositeOperation = 'multiply'; // Ink effect
                                ctx.fillStyle = targetHex + '40'; // 25% opacity fill
                            }

                            // Draw Fill
                            if (style === 'circle') {
                                ctx.beginPath();
                                const radius = Math.max((blob.maxX - blob.minX) / 2, (blob.maxY - blob.minY) / 2);
                                ctx.arc(centerX, centerY, radius + 5, 0, Math.PI * 2);
                                ctx.fill();
                            } else {
                                const w = (blob.maxX - blob.minX) + 10;
                                const h = (blob.maxY - blob.minY) + 10;
                                ctx.fillRect(blob.minX - 5, blob.minY - 5, w, h);
                            }

                            // Handle Stroke (Always use the detected color for the outline)
                            ctx.globalCompositeOperation = 'multiply';
                            ctx.strokeStyle = targetHex;
                            ctx.lineWidth = 3;
                            
                            if (style === 'circle') {
                                const radius = Math.max((blob.maxX - blob.minX) / 2, (blob.maxY - blob.minY) / 2);
                                ctx.beginPath();
                                ctx.arc(centerX, centerY, radius + 5, 0, Math.PI * 2);
                                ctx.stroke();
                            } else {
                                const w = (blob.maxX - blob.minX) + 10;
                                const h = (blob.maxY - blob.minY) + 10;
                                ctx.strokeRect(blob.minX - 5, blob.minY - 5, w, h);
                            }
                        });

                        // Step 2: Draw connecting lines
                        if (doConnect && centers.length > 1) {
                            const sortedCenters = sortNearestNeighbor(centers);
                            ctx.strokeStyle = targetHex;
                            ctx.lineWidth = 4;
                            ctx.globalAlpha = 0.7;

                            // Apply dashed line setting
                            if (lineType === 'dashed') {
                                // Scale dash length slightly with line width for better visibility
                                ctx.setLineDash([10, 10]); 
                            } else {
                                ctx.setLineDash([]);
                            }

                            ctx.beginPath();
                            ctx.moveTo(sortedCenters[0].x, sortedCenters[0].y);
                            for (let i = 1; i < sortedCenters.length; i++) {
                                ctx.lineTo(sortedCenters[i].x, sortedCenters[i].y);
                            }
                            ctx.stroke();
                            
                            // Reset dash for the next color iteration
                            ctx.setLineDash([]);
                        }
                    }
                }

                // Reset canvas modes
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                ctx.setLineDash([]);

                statusText.innerText = `Done! Found ${totalBlobsFound} color regions.`;
                statusText.style.color = "#00ff00";
                processBtn.disabled = false;
            }, 50);
        });

        // --- Flood Fill Algorithm ---
        function floodFill(startX, startY, targetRgb, tolerance, data, width, height, visited) {
            const queue = [[startX, startY]];
            const blob = {
                minX: startX, maxX: startX,
                minY: startY, maxY: startY,
                pixelCount: 0
            };

            visited[startY * width + startX] = 1;

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                blob.pixelCount++;

                if (x < blob.minX) blob.minX = x;
                if (x > blob.maxX) blob.maxX = x;
                if (y < blob.minY) blob.minY = y;
                if (y > blob.maxY) blob.maxY = y;

                const neighbors = [
                    [x + 2, y], [x - 2, y],
                    [x, y + 2], [x, y - 2]
                ];

                for (const [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        const nVisitedIdx = ny * width + nx;
                        if (!visited[nVisitedIdx]) {
                            const idx = (ny * width + nx) * 4;
                            const r = data[idx];
                            const g = data[idx + 1];
                            const b = data[idx + 2];
                            
                            if (colorDistance(r, g, b, targetRgb.r, targetRgb.g, targetRgb.b) <= tolerance) {
                                visited[nVisitedIdx] = 1;
                                queue.push([nx, ny]);
                            }
                        }
                    }
                }
            }
            return blob;
        }
    </script>
</body>
</html>
