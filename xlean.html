<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Network URL Extractor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background: rgba(255,255,255,0.01);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }

        .filter-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h1>Universal URL Extractor</h1>
    <p class="subtitle">Extract, filter, and clean URLs from ANY raw network paste or HAR file instantly.</p>

    <div class="section">
        <label for="fileInput">Option A: Upload your network log/txt/har file</label>
        <input type="file" id="fileInput" accept=".txt,.har,.json">
    </div>

    <div style="text-align: center; margin: 15px 0; color: #64748b; font-size: 12px; font-weight: bold;">OR</div>

    <div class="section">
        <label for="textBox">Option B: Paste the raw data dump directly</label>
        <textarea id="textBox" placeholder="Paste your 'Copy All As HAR' or raw text dump here..."></textarea>
    </div>

    <div class="section filter-box">
        <label for="filterInput">Optional: Filter by keyword / file type</label>
        <input type="text" id="filterInput" placeholder="e.g., .png, cdn, api/v1, or leave blank for ALL links">
    </div>

    <button id="processBtn" onclick="processData()">Extract & Download Clean Links</button>

    <div id="status"></div>
</div>

<script>
    function processData() {
        const fileInput = document.getElementById('fileInput');
        const textBox = document.getElementById('textBox');
        const statusDiv = document.getElementById('status');

        statusDiv.className = '';
        statusDiv.innerText = '';

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                extractAndDownload(e.target.result);
            };
            reader.readAsText(file);
        } else if (textBox.value.trim().length > 0) {
            extractAndDownload(textBox.value);
        } else {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Please upload a file or paste text first!';
        }
    }

    function extractAndDownload(rawText) {
        const statusDiv = document.getElementById('status');
        const filterKeyword = document.getElementById('filterInput').value.trim().toLowerCase();
        
        // Universal URL Match Regex
        const regex = /https?:\/\/[^\s"'`<>\\^]+[^"'\s`<>,.?:]/g;
        let matches = rawText.match(regex) || [];

        if (matches.length === 0) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'No URLs found in the provided data.';
            return;
        }

        // Apply Twitter/X orig cleanup if the URL happens to be a Twitter media link
        let cleanedLinks = matches.map(url => {
            if (url.includes('pbs.twimg.com/media/')) {
                if (url.includes('?')) {
                    return url.replace(/name=[^&"'\s]+/g, 'name=orig');
                } else {
                    return url + '?format=jpg&name=orig';
                }
            }
            return url;
        });

        // Filter links if user specified a keyword
        if (filterKeyword) {
            cleanedLinks = cleanedLinks.filter(url => url.toLowerCase().includes(filterKeyword));
        }

        // Deduplicate
        const uniqueLinks = [...new Set(cleanedLinks)];

        if (uniqueLinks.length === 0) {
            statusDiv.className = 'error';
            statusDiv.innerText = `Found links, but 0 matched your filter: "${filterKeyword}"`;
            return;
        }

        // Generate download
        const fileContent = uniqueLinks.join('\n');
        const blob = new Blob([fileContent], { type: 'text/plain' });
        const downloadUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filterKeyword ? `filtered_${filterKeyword}_links.txt` : 'extracted_links.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        statusDiv.className = 'success';
        statusDiv.innerText = `Success! Extracted ${uniqueLinks.length} unique links directly to your downloads folder.`;
    }
</script>

</body>
</html>
