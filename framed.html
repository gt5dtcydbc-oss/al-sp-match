<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Framed - Kitsu Edition</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #16161a;
            --card-bg-2: #1b1b20;
            --text-color: #f3f4f6;
            --muted-text: #a1a1aa;
            --subtle-text: #71717a;
            --accent-color: #d4d4d8;
            --border-color: #27272a;
            --success-color: #10b981;
            --fail-color: #ef4444;
            --skip-color: #71717a;
            --radius: 12px;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: var(--text-color);
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        button, input, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .app-shell {
            width: 100%;
            max-width: 500px;
        }

        .game-card {
            width: 100%;
        }

        .hero-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            line-height: 1;
            letter-spacing: 0.08em;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-button {
            min-width: 34px;
            width: auto;
            height: 34px;
            display: inline-grid;
            place-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--muted-text);
            background: transparent;
            cursor: pointer;
            font-weight: 700;
            padding: 0 9px;
            font-size: 0.82rem;
        }

        .helper-button { display: none; }

        .icon-button:hover,
        .icon-button:focus-visible {
            color: var(--text-color);
            border-color: #3f3f46;
            background: #18181b;
        }

        .mode-selector {
            margin-bottom: 14px;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .mode-option {
            min-height: 34px;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--muted-text);
            background: transparent;
            cursor: pointer;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .mode-option.active {
            color: var(--text-color);
            border-color: #52525b;
            background: var(--card-bg);
        }

        .mode-option-subtitle,
        .mode-selector-copy,
        .puzzle-meta,
        .frame-hint,
        .progress-label-row,
        .hint-header,
        .search-label,
        .eyebrow,
        .tagline {
            display: none !important;
        }

        .loader {
            display: grid;
            min-height: 360px;
            place-items: center;
            text-align: center;
            color: var(--muted-text);
        }

        .loader-card {
            display: grid;
            gap: 12px;
            justify-items: center;
            font-weight: 500;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid #27272a;
            border-top-color: #a1a1aa;
            border-radius: 999px;
            animation: spin 0.85s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .game-interface { display: none; }

        .frame-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .attempt-counter {
            color: var(--muted-text);
            font-size: 0.8rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        .frame-window {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: min(64vh, 650px);
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: #050505;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.45);
        }

        .frame-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease, transform 0.3s ease, object-position 0.3s ease;
        }

        .frame-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            padding: 5px 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(5, 5, 5, 0.65);
            color: #e4e4e7;
            font-size: 0.76rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }

        .frame-badge-dot { display: none; }

        .frame-style-0 { filter: blur(14px); transform: scale(1.6); object-position: center; }
        .frame-style-1 { filter: blur(8px); transform: scale(1.4); object-position: center; }
        .frame-style-2 { filter: blur(4px); transform: scale(1.2); object-position: center; }
        .frame-style-3 { filter: blur(2px); transform: scale(1.1); object-position: center; }
        .frame-style-4 { filter: blur(0); transform: scale(1.2); object-position: top; }
        .frame-style-5 { filter: blur(0); transform: scale(1); object-position: center; }

        .progress-section {
            margin: 12px 0;
        }

        .steps-container {
            display: flex;
            gap: 6px;
        }

        .step-button {
            flex: 1;
            height: 8px;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            color: transparent;
            background: #27272a;
            cursor: pointer;
            font-size: 0;
        }

        .step-button:disabled {
            cursor: not-allowed;
            opacity: 1;
        }

        .step-button.unlocked { background: #52525b; }
        .step-button.active { background: #e4e4e7; }
        .step-button.correct { background: var(--success-color); }
        .step-button.wrong { background: var(--fail-color); }
        .step-button.skipped { background: var(--skip-color); }

        .feedback {
            min-height: 0;
            margin: 0 0 10px;
            color: var(--muted-text);
            font-size: 0.86rem;
            line-height: 1.35;
        }

        .feedback:empty { display: none; }
        .feedback.success { color: var(--success-color); }
        .feedback.error { color: #fca5a5; }
        .feedback.skip { color: var(--muted-text); }

        .hint-panel {
            margin: 0 0 10px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
        }

        .hint-panel[hidden] { display: none; }

        .hint-list {
            display: grid;
            gap: 6px;
        }

        .hint-item {
            display: flex;
            gap: 8px;
            color: #d4d4d8;
            font-size: 0.86rem;
        }

        .hint-key {
            color: var(--muted-text);
            font-weight: 700;
        }

        .input-area {
            display: grid;
            gap: 10px;
        }

        .search-box { position: relative; }
        .search-input-wrap { position: relative; }
        .search-icon { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            background: var(--card-bg);
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus { border-color: #52525b; }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.45);
        }

        .autocomplete-dropdown.open { display: block; }

        .autocomplete-item {
            width: 100%;
            display: grid;
            grid-template-columns: 34px 1fr;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border: 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            background: transparent;
            cursor: pointer;
            text-align: left;
        }

        .autocomplete-item:hover,
        .autocomplete-item.highlighted { background: #212127; }

        .autocomplete-poster {
            width: 34px;
            height: 46px;
            object-fit: cover;
            border-radius: 4px;
            background: #09090b;
        }

        .autocomplete-title,
        .autocomplete-meta {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .autocomplete-title {
            font-size: 0.92rem;
            font-weight: 650;
        }

        .autocomplete-meta {
            margin-top: 2px;
            color: var(--muted-text);
            font-size: 0.76rem;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            min-height: 46px;
            padding: 12px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.94rem;
        }

        .btn-submit { color: #111113; background: #e4e4e7; }
        .btn-submit:hover { background: #fff; }
        .btn-skip { color: #fff; background: #27272a; }
        .btn-skip:hover { background: #3f3f46; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .guesses-log {
            display: grid;
            gap: 6px;
            margin-top: 12px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 22px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: #d4d4d8;
            font-size: 0.88rem;
        }

        .guess-index {
            color: var(--subtle-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        .guess-text {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .guess-status {
            color: var(--muted-text);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .guess-row.correct { border-left: 4px solid var(--success-color); }
        .guess-row.wrong { border-left: 4px solid var(--fail-color); }
        .guess-row.skipped { border-left: 4px solid var(--skip-color); }

        .end-panel {
            display: none;
            margin-top: 14px;
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--card-bg);
            text-align: center;
        }

        .end-title {
            margin: 0 0 8px;
            font-size: 1.35rem;
            line-height: 1.15;
        }

        .end-meta {
            margin: 0;
            color: #d4d4d8;
            line-height: 1.45;
        }

        .answer-title {
            display: block;
            margin-top: 4px;
            color: #fff;
            font-size: 1.18rem;
            font-weight: 800;
        }

        .share-box {
            width: 100%;
            min-height: 104px;
            margin: 14px 0 10px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #e4e4e7;
            background: #111114;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.84rem;
            line-height: 1.4;
            resize: none;
        }

        .end-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .secondary-note {
            margin: 12px 0 0;
            color: var(--muted-text);
            font-size: 0.8rem;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            place-items: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.64);
        }

        .modal-backdrop.open { display: grid; }

        .stats-modal {
            width: min(100%, 430px);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.15rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            padding: 12px 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #111114;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .stat-label {
            display: block;
            margin-top: 3px;
            color: var(--muted-text);
            font-size: 0.72rem;
        }

        .distribution-title {
            margin: 16px 0 8px;
            color: var(--muted-text);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .distribution {
            display: grid;
            gap: 6px;
        }

        .dist-row {
            display: grid;
            grid-template-columns: 18px 1fr 24px;
            gap: 8px;
            align-items: center;
            color: var(--muted-text);
            font-size: 0.8rem;
        }

        .dist-bar-track {
            height: 20px;
            overflow: hidden;
            border-radius: 4px;
            background: #27272a;
        }

        .dist-bar {
            height: 100%;
            border-radius: inherit;
            background: #52525b;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        :focus-visible {
            outline: 2px solid #a1a1aa;
            outline-offset: 2px;
        }

        @media (max-width: 560px) {
            body { padding: 14px; }
            h1 { font-size: 1.45rem; letter-spacing: 0.06em; }
            .header-actions { gap: 5px; }
            .icon-button { width: 32px; height: 32px; }
            .frame-window { max-height: 58vh; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .button-row, .end-actions { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <section class="game-card" aria-labelledby="game-title">
            <header class="hero-header">
                <h1 id="game-title">Amiron67</h1>
                <div class="header-actions" aria-label="Game actions">
                    <button class="icon-button" id="btn-stats" type="button" aria-label="Stats">Stats</button>
                    <button class="icon-button helper-button" id="btn-help" type="button" aria-label="Help">?</button>
                </div>
            </header>

            <section class="mode-selector" aria-label="Mode">
                <div class="mode-selector-copy">
                    <span class="meta-label" id="mode-title">Mode</span>
                </div>
                <div class="mode-buttons" role="group" aria-label="Puzzle mode">
                    <button class="mode-option" id="mode-popular" type="button" data-mode="popular">
                        <span class="mode-option-title">Popular</span>
                        <span class="mode-option-subtitle">Top 1000</span>
                    </button>
                    <button class="mode-option" id="mode-expert" type="button" data-mode="expert">
                        <span class="mode-option-title">Expert</span>
                        <span class="mode-option-subtitle">Hints</span>
                    </button>
                </div>
            </section>

            <div class="puzzle-meta" aria-hidden="true">
                <span id="current-date">Popular</span>
                <span id="status-pill">Loading</span>
            </div>

            <div id="loader" class="loader" role="status" aria-live="polite">
                <div class="loader-card">
                    <div class="spinner" aria-hidden="true"></div>
                    <div id="loader-text">Loading...</div>
                </div>
            </div>

            <div id="game-interface" class="game-interface">
                <div class="frame-toolbar">
                    <div class="attempt-counter" id="attempt-counter">1/6</div>
                    <div class="frame-hint" id="frame-hint"></div>
                </div>

                <div class="frame-window">
                    <img id="game-poster" src="" alt="Blurred anime poster clue">
                    <div class="frame-badge" aria-hidden="true">
                        <span class="frame-badge-dot"></span>
                        <span id="frame-badge-text">Popular · 1/6</span>
                    </div>
                </div>

                <section class="progress-section" aria-labelledby="progress-title">
                    <div class="progress-label-row">
                        <div class="progress-title" id="progress-title">Frames</div>
                        <div class="progress-helper">Review unlocked frames</div>
                    </div>
                    <div class="steps-container" id="steps-container" role="group" aria-label="Unlocked clue frames">
                        <button class="step-button unlocked active" type="button" data-index="0" aria-label="View frame 1">1</button>
                        <button class="step-button" type="button" data-index="1" aria-label="View frame 2" disabled>2</button>
                        <button class="step-button" type="button" data-index="2" aria-label="View frame 3" disabled>3</button>
                        <button class="step-button" type="button" data-index="3" aria-label="View frame 4" disabled>4</button>
                        <button class="step-button" type="button" data-index="4" aria-label="View frame 5" disabled>5</button>
                        <button class="step-button" type="button" data-index="5" aria-label="View frame 6" disabled>6</button>
                    </div>
                </section>

                <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

                <section class="hint-panel" id="hint-panel" aria-labelledby="hint-title" hidden>
                    <div class="hint-header">
                        <div>
                            <span class="hint-title" id="hint-title">Hints</span>
                            <span class="hint-subtitle">Expert only</span>
                        </div>
                        <span class="hint-count" id="hint-count">0/2</span>
                    </div>
                    <div class="hint-list" id="hint-list"></div>
                </section>

                <div id="input-area" class="input-area">
                    <div class="search-box">
                        <label class="search-label" for="anime-search">Guess</label>
                        <div class="search-input-wrap">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M10.75 18.5a7.75 7.75 0 1 1 0-15.5 7.75 7.75 0 0 1 0 15.5Zm5.48-2.27L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="anime-search" placeholder="Type anime title..." autocomplete="off" autocapitalize="words" aria-autocomplete="list" aria-expanded="false" aria-controls="autocomplete-list">
                        </div>
                        <div class="autocomplete-dropdown" id="autocomplete-list" role="listbox" aria-label="Anime suggestions"></div>
                    </div>
                    <div class="button-row">
                        <button class="btn btn-skip" id="btn-skip" type="button">Skip</button>
                        <button class="btn btn-submit" id="btn-submit" type="button">Submit</button>
                    </div>
                </div>

                <div class="guesses-log" id="guesses-log" aria-label="Guess history"></div>

                <section class="end-panel" id="end-panel" aria-labelledby="end-title">
                    <h2 class="end-title" id="end-title"></h2>
                    <p class="end-meta" id="end-meta"></p>
                    <textarea class="share-box" id="share-text" readonly aria-label="Shareable result"></textarea>
                    <div class="end-actions">
                        <button class="btn btn-submit" id="btn-copy" type="button">Copy</button>
                        <button class="btn btn-skip" id="btn-open-stats" type="button">Stats</button>
                    </div>
                    <p class="secondary-note">New puzzle at midnight.</p>
                </section>
            </div>
        </section>
    </main>

    <div class="modal-backdrop" id="stats-backdrop" role="dialog" aria-modal="true" aria-labelledby="stats-title">
        <div class="stats-modal">
            <div class="modal-header">
                <h2 id="stats-title">Stats</h2>
                <button class="icon-button" id="btn-close-stats" type="button" aria-label="Close stats">×</button>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
            <p class="distribution-title">Guess distribution</p>
            <div class="distribution" id="distribution"></div>
        </div>
    </div>
    <script>
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3024734485, h3 = 3362453611, h4 = 502494348;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            return [(h1 >>> 0), (h2 >>> 0), (h3 >>> 0), (h4 >>> 0)];
        }

        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
                let t = (a + b) | 0;
                a = b ^ (b >>> 9);
                b = (c + (c << 3)) | 0;
                c = (c << 21) | (c >>> 11);
                d = (d + 1) | 0;
                t = (t + d) | 0;
                c = (c + t) | 0;
                return (t >>> 0) / 4294967296;
            };
        }

        const MAX_GUESSES = 6;
        const STORAGE_VERSION = "v3";
        const MODE_PREF_KEY = `anime_framed_mode_${STORAGE_VERSION}`;
        const TARGET_CACHE_PREFIX = `anime_framed_target_${STORAGE_VERSION}`;

        const MODE_DEFS = {
            popular: {
                id: "popular",
                label: "Popular",
                meta: "Top 1000 pool",
                shareLabel: "Popular",
                statusReady: "Popular mode",
                rankMin: 0,
                rankMax: 999,
                hintMode: false
            },
            expert: {
                id: "expert",
                label: "Expert",
                meta: "Ranks 1001-6000",

        const FALLBACK_POPULAR_POOL_IDS = [

        const FALLBACK_EXPERT_POOL_IDS = [
            30, 43, 45, 46, 57, 58, 71, 85, 90, 91,
            102, 121, 132, 145, 164, 167, 169, 185, 199, 205,
            226, 239, 269, 323, 339, 358, 371, 403, 457, 481,

        function getLocalDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        const todayStr = getLocalDateString();
        const puzzleId = todayStr.replace(/-/g, "");

        let currentMode = getInitialMode();
        let currentStep = 0;
        let activeViewStep = 0;
        let targetAnime = null;

        function getInitialMode() {
            const stored = localStorage.getItem(MODE_PREF_KEY);
            return MODE_DEFS[stored] ? stored : "popular";
        }

        function getModeDef() {
            return MODE_DEFS[currentMode] || MODE_DEFS.popular;
        }

        function createModeRng(modeId) {
            const seed = cyrb128(`${todayStr}:${modeId}`);
            return sfc32(seed[0], seed[1], seed[2], seed[3]);
        }

        function getStateKey() {
            return `anime_framed_state_${STORAGE_VERSION}_${currentMode}_${puzzleId}`;
        }

        function getStatsKey() {
            return `anime_framed_stats_${STORAGE_VERSION}_${currentMode}`;
        }

        function getTargetCacheKey(modeId = currentMode) {
            return `${TARGET_CACHE_PREFIX}_${modeId}_${puzzleId}`;
        }

        function setMode(modeId) {
            if (!MODE_DEFS[modeId] || modeId === currentMode) return;
            currentMode = modeId;
            localStorage.setItem(MODE_PREF_KEY, currentMode);
            initGame();
        }

        function updateModeUi() {
            const mode = getModeDef();
            els.currentDate.innerText = mode.label;
            els.modeButtons.forEach((button) => {
                const active = button.dataset.mode === currentMode;
                button.classList.toggle("active", active);
                button.setAttribute("aria-pressed", active ? "true" : "false");
            });
        }

        function resetForLoad() {
            clearTimeout(searchTimeout);
            currentStep = 0;
            activeViewStep = 0;
            targetAnime = null;
            targetAnimeId = null;
            targetCategories = [];
            gameOver = false;
            savedHistory = [];
            selectedSuggestion = null;
            suggestions = [];
            highlightedIndex = -1;
            els.searchInput.value = "";
            els.searchInput.disabled = false;
            els.btnSubmit.disabled = false;
            els.btnSkip.disabled = false;
            els.inputArea.style.display = "grid";
            els.endPanel.style.display = "none";
            els.loader.style.display = "grid";
            els.gameInterface.style.display = "none";
            clearAutocomplete();
            resetVisualState();
            updateModeUi();
            updateStatus("Loading");
            renderHints();
        }

        async function initGame() {
            const runId = ++initRunId;
            resetForLoad();
            const mode = getModeDef();
            els.loaderText.innerText = "Loading...";

            try {
                const data = await getTargetForMode(mode);
                if (runId !== initRunId) return;

                targetAnimeId = String(data.id);
                targetAnime = data.attributes || {};
                targetCategories = await fetchTargetCategories(targetAnimeId);
                if (runId !== initRunId) return;

                const posterUrl = getPosterUrl(targetAnime);
                els.poster.src = posterUrl;
                els.poster.alt = "Blurred anime poster clue";

                loadGameState();
                els.loader.style.display = "none";
                els.gameInterface.style.display = "block";
                renderStats();
                renderHints();
            } catch (err) {
                console.error("Initialization pipeline crashed:", err);
                els.loaderText.innerText = "Network error. Retrying...";
                setTimeout(() => {
                    if (runId === initRunId) initGame();
                }, 3000);
            }
        }

        async function getTargetForMode(mode) {
            const cached = getCachedTarget(mode.id);
            if (cached) return cached;

            try {
                const ranked = await fetchRankedTarget(mode);
                cacheTarget(mode.id, ranked);
                return ranked;
            } catch (err) {
                console.warn("Ranked target fetch failed. Using fallback pool.", err);
                const fallback = await fetchFallbackTarget(mode);
                cacheTarget(mode.id, fallback);
                return fallback;
            }
        }

        function getCachedTarget(modeId) {
            try {
                const raw = localStorage.getItem(getTargetCacheKey(modeId));
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (parsed.puzzleId === puzzleId && parsed.modeId === modeId && parsed.data?.id && parsed.data?.attributes) {
                    return parsed.data;
                }
            } catch (err) {
                localStorage.removeItem(getTargetCacheKey(modeId));
            }
            return null;
        }

        function cacheTarget(modeId, data) {
            const payload = { puzzleId, modeId, data };
            localStorage.setItem(getTargetCacheKey(modeId), JSON.stringify(payload));
        }

        async function fetchRankedTarget(mode) {
            const rng = createModeRng(mode.id);
            const span = mode.rankMax - mode.rankMin + 1;
            const offset = mode.rankMin + Math.floor(rng() * span);
            const url = `https://kitsu.io/api/edge/anime?sort=popularityRank&page[limit]=10&page[offset]=${offset}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Kitsu ranked search returned ${response.status}`);
            const json = await response.json();
            const candidates = Array.isArray(json.data) ? json.data : [];
            const selected = candidates.find((item) => item?.attributes?.canonicalTitle && getPosterUrl(item.attributes));
            if (!selected) throw new Error("No ranked candidate with title and poster.");
            return selected;
        }

        async function fetchFallbackTarget(mode) {
            const pool = mode.id === "popular" ? FALLBACK_POPULAR_POOL_IDS : FALLBACK_EXPERT_POOL_IDS;
            const rng = createModeRng(`${mode.id}:fallback`);
            const targetId = pool[Math.floor(rng() * pool.length)];
            const response = await fetch(`https://kitsu.io/api/edge/anime/${targetId}`);
            if (!response.ok) throw new Error(`Fallback target returned ${response.status}`);
            const json = await response.json();
            if (!json.data || !json.data.attributes) throw new Error("Malformed fallback target.");
            return json.data;
        }

        async function fetchTargetCategories(animeId) {
            try {
                const response = await fetch(`https://kitsu.io/api/edge/anime/${animeId}/categories?page[limit]=8`);
                if (!response.ok) return [];
                const json = await response.json();
                return Array.isArray(json.data) ? json.data : [];
            } catch (err) {
                console.warn("Hint category fetch failed:", err);
                return [];
            }
        }

        function getPosterUrl(attributes) {
            const poster = attributes?.posterImage || {};
            return poster.large || poster.medium || poster.original || poster.small || "";
        }

        function getSafeState() {
            try {
                const raw = localStorage.getItem(getStateKey());
                return raw ? JSON.parse(raw) : null;
            } catch (err) {
                localStorage.removeItem(getStateKey());
                return null;
            }
        }

        function getDefaultStats() {
            return {
                played: 0,
                wins: 0,
                currentStreak: 0,
                maxStreak: 0,
                guessDistribution: [0, 0, 0, 0, 0, 0],
                lastCompletedPuzzleId: null
            };
        }

        function getStats() {
            try {
                const stored = JSON.parse(localStorage.getItem(getStatsKey())) || {};
                return { ...getDefaultStats(), ...stored, guessDistribution: stored.guessDistribution || [0, 0, 0, 0, 0, 0] };
            } catch (err) {
                localStorage.removeItem(getStatsKey());
                return getDefaultStats();
            }
        }

        function saveStats(stats) {
            localStorage.setItem(getStatsKey(), JSON.stringify(stats));
        }

        function saveGameState(status = "IN_PROGRESS") {
            const statePayload = {
                puzzleId,
                mode: currentMode,
                targetAnimeId,
                currentStep,
                status,
                history: savedHistory
            };
            localStorage.setItem(getStateKey(), JSON.stringify(statePayload));
        }

        function loadGameState() {
            const parsed = getSafeState();
            if (!parsed || parsed.puzzleId !== puzzleId || parsed.mode !== currentMode || parsed.targetAnimeId !== targetAnimeId) {
                localStorage.removeItem(getStateKey());
                resetVisualState();
                setFeedback("");
                updateFrameView(0);
                updateStatus(getModeDef().statusReady);
                renderHints();
                return;
            }

            currentStep = Math.min(parsed.currentStep || 0, MAX_GUESSES);
            savedHistory = Array.isArray(parsed.history) ? parsed.history : [];
            resetVisualState();
            savedHistory.forEach((logItem, idx) => addGuessRow(logItem, idx));

            if (parsed.status === "WON") {
                processEndgame(true, true);
            } else if (parsed.status === "LOST") {
                processEndgame(false, true);
            } else {
                unlockStepsThrough(currentStep);
                updateFrameView(currentStep);
                updateStatus(getModeDef().statusReady);
                renderHints();
            }
        }

        function resetVisualState() {
            els.guessesLog.innerHTML = "";
            els.stepButtons.forEach((button, idx) => {
                button.className = "step-button";
                button.disabled = idx !== 0;
                button.setAttribute("aria-label", `View frame ${idx + 1}`);
            });
            els.stepButtons[0].classList.add("unlocked", "active");
        }

        function unlockStepsThrough(stepIndex) {
            els.stepButtons.forEach((button, idx) => {
                if (idx <= stepIndex || gameOver) {
                    button.disabled = false;
                    button.classList.add("unlocked");
                }
            });
        }

        function updateFrameView(stepIndex) {
            if (!gameOver && stepIndex > currentStep) return;
            activeViewStep = Math.min(stepIndex, MAX_GUESSES - 1);
            els.poster.className = `frame-style-${activeViewStep}`;
            els.stepButtons.forEach((button, idx) => {
                button.classList.toggle("active", idx === activeViewStep);
                button.setAttribute("aria-pressed", idx === activeViewStep ? "true" : "false");
            });
            els.frameBadgeText.innerText = `${getModeDef().label} · ${activeViewStep + 1}/${MAX_GUESSES}`;
            updateCounters();
        }

        function updateCounters() {
            const attemptNumber = Math.min(currentStep + 1, MAX_GUESSES);
            els.attemptCounter.innerText = gameOver ? "Complete" : `${attemptNumber}/${MAX_GUESSES}`;
            els.frameHint.innerText = gameOver ? "" : "";
        }

        function updateStatus(text) {
            els.statusPill.innerText = text;
        }

        function setFeedback(text, tone = "") {
            els.feedback.textContent = text;
            els.feedback.className = `feedback${tone ? ` ${tone}` : ""}`;
        }

        function addGuessRow(logItem, idx) {
            const row = document.createElement("div");
            row.className = `guess-row ${logItem.type}`;

            const index = document.createElement("span");
            index.className = "guess-index";
            index.textContent = idx + 1;

            const text = document.createElement("span");
            text.className = "guess-text";
            text.textContent = logItem.text;

            const status = document.createElement("span");
            status.className = "guess-status";
            status.textContent = logItem.type === "correct" ? "Correct" : logItem.type === "skipped" ? "Skipped" : "Wrong";

            row.append(index, text, status);
            els.guessesLog.appendChild(row);

            const step = els.stepButtons[idx];
            if (step) {
                step.classList.remove("active");
                step.classList.add(logItem.type);
                step.disabled = false;
                step.setAttribute("aria-label", `Frame ${idx + 1}: ${status.textContent}. Guess: ${logItem.text}`);
            }
        }

        function normalizeTitle(value) {
            return String(value || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/&/g, " and ")
                .replace(/[^a-z0-9]+/g, " ")
                .replace(/\b(the|a|an)\b/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function getTargetTitles() {
            const titleObj = targetAnime?.titles || {};
            const titles = [
                targetAnime?.canonicalTitle,
                titleObj.en,
                titleObj.en_jp,
                titleObj.en_us,
                titleObj.ja_jp
            ].filter(Boolean);
            return Array.from(new Set(titles));
        }

        function levenshtein(a, b) {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = b.charAt(i - 1) === a.charAt(j - 1) ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[b.length][a.length];
        }

        function isCorrectGuess(rawGuess) {
            if (selectedSuggestion && String(selectedSuggestion.id) === targetAnimeId) {
                return true;
            }

            const guess = normalizeTitle(rawGuess);
            if (!guess) return false;

            const normalizedTargets = getTargetTitles().map(normalizeTitle).filter(Boolean);
            if (normalizedTargets.includes(guess)) return true;

            return normalizedTargets.some((target) => {
                if (target.length < 5 || guess.length < 5) return false;
                if (target.includes(guess) && guess.length >= Math.min(8, target.length)) return true;
                if (guess.includes(target) && target.length >= Math.min(8, guess.length)) return true;
                const maxDistance = Math.max(target.length, guess.length) >= 12 ? 2 : 1;
                return levenshtein(target, guess) <= maxDistance;
            });
        }

        function formatAnimeMeta(attributes) {
            const bits = [];
            if (attributes.startDate) bits.push(attributes.startDate.slice(0, 4));
            if (attributes.subtype) bits.push(capitalize(attributes.subtype));
            if (attributes.episodeCount) bits.push(`${attributes.episodeCount} eps`);
            return bits.join(" - ") || "Anime";
        }

        function capitalize(value) {
            return String(value || "").charAt(0).toUpperCase() + String(value || "").slice(1);
        }

        function clearAutocomplete() {
            suggestions = [];
            highlightedIndex = -1;
            els.autocomplete.innerHTML = "";
            els.autocomplete.classList.remove("open");
            els.searchInput.setAttribute("aria-expanded", "false");
            els.searchInput.removeAttribute("aria-activedescendant");
        }

        function renderSearchDropdown(items) {
            els.autocomplete.innerHTML = "";
            suggestions = Array.isArray(items) ? items : [];
            highlightedIndex = -1;

            if (!suggestions.length) {
                clearAutocomplete();
                return;
            }

            suggestions.forEach((item, idx) => {
                const attrs = item.attributes || {};
                const button = document.createElement("button");
                button.type = "button";
                button.className = "autocomplete-item";
                button.id = `suggestion-${idx}`;
                button.setAttribute("role", "option");
                button.setAttribute("aria-selected", "false");

                const img = document.createElement("img");
                img.className = "autocomplete-poster";
                img.alt = "";
                img.loading = "lazy";
                img.src = getPosterUrl(attrs);

                const copy = document.createElement("span");
                const title = document.createElement("span");
                title.className = "autocomplete-title";
                title.textContent = attrs.canonicalTitle || "Untitled anime";
                const meta = document.createElement("span");
                meta.className = "autocomplete-meta";
                meta.textContent = formatAnimeMeta(attrs);
                copy.append(title, meta);

                button.append(img, copy);
                button.addEventListener("click", () => selectSuggestion(idx));
                els.autocomplete.appendChild(button);
            });

            els.autocomplete.classList.add("open");
            els.searchInput.setAttribute("aria-expanded", "true");
        }

        function selectSuggestion(index) {
            const item = suggestions[index];
            if (!item) return;
            selectedSuggestion = item;
            els.searchInput.value = item.attributes?.canonicalTitle || "";
            clearAutocomplete();
            els.searchInput.focus();
        }

        function updateHighlightedSuggestion(nextIndex) {
            const items = Array.from(els.autocomplete.querySelectorAll(".autocomplete-item"));
            if (!items.length) return;
            highlightedIndex = (nextIndex + items.length) % items.length;
            items.forEach((item, idx) => {
                const isActive = idx === highlightedIndex;
                item.classList.toggle("highlighted", isActive);
                item.setAttribute("aria-selected", isActive ? "true" : "false");
                if (isActive) {
                    els.searchInput.setAttribute("aria-activedescendant", item.id);
                    item.scrollIntoView({ block: "nearest" });
                }
            });
        }

        function getMissCount() {
            return savedHistory.filter((item) => item.type !== "correct").length;
        }

        function getPrimaryGenre() {
            const category = targetCategories.find((item) => item?.attributes?.title || item?.attributes?.slug);
            const raw = category?.attributes?.title || category?.attributes?.slug || "";
            return raw ? raw.split("-").map(capitalize).join(" ") : "";
        }

        function getExpertHints() {
            const year = targetAnime?.startDate ? targetAnime.startDate.slice(0, 4) : "release year unavailable";
            const genre = getPrimaryGenre();
            const fallbackType = targetAnime?.subtype ? capitalize(targetAnime.subtype) : "anime";
            return [
                { threshold: 1, label: "Year", text: year === "release year unavailable" ? "Release year unavailable" : `First released in ${year}` },
                { threshold: 3, label: "Genre", text: genre ? `Main genre: ${genre}` : `Format clue: ${fallbackType}` }
            ];
        }

        function getUnlockedHints() {
            if (!getModeDef().hintMode) return [];
            const misses = getMissCount();
            return getExpertHints().filter((hint) => misses >= hint.threshold);
        }

        function renderHints() {
            if (!els.hintPanel || !getModeDef().hintMode || !targetAnime) {
                if (els.hintPanel) els.hintPanel.hidden = true;
                return;
            }

            const unlocked = getUnlockedHints();
            if (!unlocked.length) {
                els.hintPanel.hidden = true;
                els.hintList.innerHTML = "";
                els.hintCount.textContent = "0/2";
                return;
            }

            els.hintPanel.hidden = false;
            els.hintCount.textContent = `${unlocked.length}/2`;
            els.hintList.innerHTML = "";

            unlocked.forEach((hint) => {
                const row = document.createElement("div");
                row.className = "hint-item";

                const key = document.createElement("span");
                key.className = "hint-key";
                key.textContent = hint.label;

                const text = document.createElement("span");
                text.textContent = hint.text;

                row.append(key, text);
                els.hintList.appendChild(row);
            });
        }

        els.searchInput.addEventListener("input", () => {
            clearTimeout(searchTimeout);
            selectedSuggestion = null;
            const query = els.searchInput.value.trim();

            if (query.length < 3) {
                clearAutocomplete();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const url = `https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(query)}&page[limit]=7`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`Search returned ${res.status}`);
                    const json = await res.json();
                    renderSearchDropdown(json.data);
                } catch (err) {
                    console.error("Search index retrieval failed", err);
                    clearAutocomplete();
                    setFeedback("Suggestions unavailable. You can still submit.", "error");
                }
            }, 260);
        });

        els.searchInput.addEventListener("keydown", (event) => {
            const isOpen = els.autocomplete.classList.contains("open");
            if (event.key === "ArrowDown" && isOpen) {
                event.preventDefault();
                updateHighlightedSuggestion(highlightedIndex + 1);
            } else if (event.key === "ArrowUp" && isOpen) {
                event.preventDefault();
                updateHighlightedSuggestion(highlightedIndex - 1);
            } else if (event.key === "Enter") {
                event.preventDefault();
                if (isOpen && highlightedIndex >= 0) {
                    selectSuggestion(highlightedIndex);
                } else {
                    submitGuess();
                }
            } else if (event.key === "Escape") {
                clearAutocomplete();
            }
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".search-box")) {
                clearAutocomplete();
            }
        });

        els.stepButtons.forEach((button, idx) => {
            button.addEventListener("click", () => updateFrameView(idx));
        });

        els.modeButtons.forEach((button) => {
            button.addEventListener("click", () => setMode(button.dataset.mode));
        });

        els.btnSubmit.addEventListener("click", submitGuess);
        els.btnSkip.addEventListener("click", () => evaluateRoundResult(false, "Skipped frame", true));
        els.btnCopy.addEventListener("click", copyShareText);
        els.btnStats.addEventListener("click", openStats);
        els.btnOpenStats.addEventListener("click", openStats);
        els.btnCloseStats.addEventListener("click", closeStats);
        els.statsBackdrop.addEventListener("click", (event) => {
            if (event.target === els.statsBackdrop) closeStats();
        });
        els.btnHelp.addEventListener("click", () => {
            const hintText = getModeDef().hintMode ? " Expert hints unlock after misses 1 and 3." : " Popular uses the top 1000 pool.";
            setFeedback(`Guess the anime. Wrong guesses and skips reveal clearer frames.${hintText}`);
            els.searchInput.focus();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && els.statsBackdrop.classList.contains("open")) {
                closeStats();
            }
        });

        function submitGuess() {
            const currentGuess = els.searchInput.value.trim();
            if (!currentGuess || gameOver) {
                if (!gameOver) setFeedback("Type a title or skip.", "error");
                return;
            }
            const correct = isCorrectGuess(currentGuess);
            evaluateRoundResult(correct, currentGuess);
        }

        function evaluateRoundResult(isCorrect, loggedText, wasSkipped = false) {
            if (gameOver) return;

            const previousHintCount = getUnlockedHints().length;
            const typeStr = isCorrect ? "correct" : (wasSkipped ? "skipped" : "wrong");
            const logItem = { text: loggedText, type: typeStr };
            savedHistory.push(logItem);
            addGuessRow(logItem, currentStep);

            if (isCorrect) {
                saveGameState("WON");
                processEndgame(true);
                return;
            }

            currentStep++;

            if (currentStep < MAX_GUESSES) {
                unlockStepsThrough(currentStep);
                updateFrameView(currentStep);
                els.searchInput.value = "";
                selectedSuggestion = null;
                saveGameState("IN_PROGRESS");
                renderHints();
                const newHintCount = getUnlockedHints().length;
                const latestHint = getUnlockedHints()[newHintCount - 1];
                const hintNote = newHintCount > previousHintCount && latestHint ? ` Hint unlocked: ${latestHint.label}.` : "";
                if (wasSkipped) {
                    setFeedback(`Skipped.${hintNote}`, "skip");
                } else {
                    setFeedback(`Not quite.${hintNote}`, "error");
                }
            } else {
                saveGameState("LOST");
                processEndgame(false);
            }
        }

        function processEndgame(victory, loadedFromStorage = false) {
            gameOver = true;
            els.searchInput.disabled = true;
            els.btnSubmit.disabled = true;
            els.btnSkip.disabled = true;
            els.inputArea.style.display = "none";
            clearAutocomplete();
            unlockStepsThrough(MAX_GUESSES - 1);
            updateFrameView(MAX_GUESSES - 1);
            updateStatus(victory ? "Solved" : "Missed");
            renderHints();

            const attemptsUsed = savedHistory.length;
            const title = targetAnime?.canonicalTitle || "Unknown title";

            els.endPanel.style.display = "block";
            els.endTitle.textContent = victory ? `Solved in ${attemptsUsed}/${MAX_GUESSES}` : "Answer";
            els.endTitle.style.color = victory ? "var(--success-color)" : "var(--fail-color)";
            els.endMeta.innerHTML = `Correct answer:<span class="answer-title"></span>`;
            els.endMeta.querySelector(".answer-title").textContent = title;
            els.shareText.value = buildShareText(victory);
            setFeedback(victory ? "Correct." : "Out of attempts.", victory ? "success" : "error");

            if (!loadedFromStorage) {
                recordCompletedGame(victory, attemptsUsed);
            }
            renderStats();
        }

        function buildShareText(victory) {
            const marks = savedHistory.map((item) => {
                if (item.type === "correct") return "\uD83D\uDFE9";
                if (item.type === "skipped") return "\u2B1B";
                return "\uD83D\uDFE5";
            }).join("");
            const score = victory ? `${savedHistory.length}/${MAX_GUESSES}` : `X/${MAX_GUESSES}`;
            const mode = getModeDef();
            const hintLine = mode.hintMode ? `\nHints: ${getUnlockedHints().length}/2` : "";
            return `Anime Framed ${mode.shareLabel} ${todayStr} ${score}\n${marks}${hintLine}\n${targetAnime?.canonicalTitle || "Unknown title"}`;
        }

        function recordCompletedGame(victory, attemptsUsed) {
            const stats = getStats();
            if (stats.lastCompletedPuzzleId === puzzleId) return;

            stats.played += 1;
            stats.lastCompletedPuzzleId = puzzleId;

            if (victory) {
                stats.wins += 1;
                stats.currentStreak += 1;
                stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
                const index = Math.max(0, Math.min(MAX_GUESSES - 1, attemptsUsed - 1));
                stats.guessDistribution[index] = (stats.guessDistribution[index] || 0) + 1;
            } else {
                stats.currentStreak = 0;
            }

            saveStats(stats);
        }

        async function copyShareText() {
            els.shareText.select();
            try {
                await navigator.clipboard.writeText(els.shareText.value);
                els.btnCopy.textContent = "Copied";
                setTimeout(() => { els.btnCopy.textContent = "Copy"; }, 1600);
            } catch (err) {
                document.execCommand("copy");
                els.btnCopy.textContent = "Copied";
                setTimeout(() => { els.btnCopy.textContent = "Copy"; }, 1600);
            }
        }

        function openStats() {
            renderStats();
            els.statsBackdrop.classList.add("open");
            els.btnCloseStats.focus();
        }

        function closeStats() {
            els.statsBackdrop.classList.remove("open");
            els.btnStats.focus();
        }

        function renderStats() {
            const stats = getStats();
            const winRate = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
            const mode = getModeDef();
            els.statsTitle.textContent = `${mode.label} stats`;
            const cards = [
                [stats.played, "Played"],
                [`${winRate}%`, "Win rate"],
                [stats.currentStreak, "Current"],
                [stats.maxStreak, "Max streak"]
            ];

            els.statsGrid.innerHTML = "";
            cards.forEach(([value, label]) => {
                const card = document.createElement("div");
                card.className = "stat-card";
                card.innerHTML = `<span class="stat-value"></span><span class="stat-label"></span>`;
                card.querySelector(".stat-value").textContent = value;
                card.querySelector(".stat-label").textContent = label;
                els.statsGrid.appendChild(card);
            });

            const max = Math.max(1, ...stats.guessDistribution);
            els.distribution.innerHTML = "";
            for (let i = 0; i < MAX_GUESSES; i++) {
                const count = stats.guessDistribution[i] || 0;
                const row = document.createElement("div");
                row.className = "dist-row";
                row.innerHTML = `<span>${i + 1}</span><div class="dist-bar-track"><div class="dist-bar"></div></div><span>${count}</span>`;
                row.querySelector(".dist-bar").style.width = `${Math.max(6, (count / max) * 100)}%`;
                els.distribution.appendChild(row);
            }
        }

        initGame();
    </script>
</body>
</html>
