<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Framed - Kitsu Edition</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #16161a;
            --text-color: #f3f4f6;
            --accent-color: #818cf8;
            --border-color: #27272a;
            --success-color: #10b981;
            --fail-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            padding-bottom: 15px;
        }

        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 3px; font-weight: 800; }
        .date-sub { color: #a1a1aa; font-size: 0.85rem; margin-top: 6px; font-family: monospace; }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .frame-window {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #050505;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .frame-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* PROGRESSIVE CLUE STATES */
        .frame-style-0 { filter: blur(14px); transform: scale(1.6); object-position: center; }
        .frame-style-1 { filter: blur(8px);  transform: scale(1.4); object-position: center; }
        .frame-style-2 { filter: blur(4px);  transform: scale(1.2); object-position: center; }
        .frame-style-3 { filter: blur(2px);  transform: scale(1.1); object-position: center; } 
        .frame-style-4 { filter: blur(0px);  transform: scale(1.2); object-position: top; }    
        .frame-style-5 { filter: blur(0px);  transform: scale(1);   object-position: center; } 

        .dots-container {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .dot {
            flex: 1;
            height: 8px;
            background-color: #27272a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dot.unlocked { background-color: #52525b; }
        .dot.active { background-color: var(--accent-color) !important; box-shadow: 0 0 8px var(--accent-color); }
        .dot.correct { background-color: var(--success-color) !important; }
        .dot.wrong { background-color: var(--fail-color) !important; }

        .search-box { position: relative; width: 100%; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent-color); }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .autocomplete-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .autocomplete-item:hover { background-color: #212127; }

        .button-row { display: flex; gap: 8px; }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-submit { background-color: var(--accent-color); color: #fff; }
        .btn-submit:hover { background-color: #6366f1; }
        .btn-skip { background-color: #27272a; color: #fff; }
        .btn-skip:hover { background-color: #3f3f46; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .guesses-log { display: flex; flex-direction: column; gap: 6px; }

        .guess-row {
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .guess-row.wrong { border-left: 4px solid var(--fail-color); color: #d4d4d8; }
        .guess-row.skipped { border-left: 4px solid #52525b; color: #71717a; }
        .guess-row.correct { border-left: 4px solid var(--success-color); font-weight: bold; }

        .end-panel {
            display: none;
            text-align: center;
            padding: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        
        .loader {
            text-align: center;
            padding: 60px;
            font-size: 1.1rem;
            color: #71717a;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>ANIME FRAMED</h1>
        <div class="date-sub" id="current-date">PUZZLE DATE: ----/--/--</div>
    </header>

    <div class="container">
        <div id="loader" class="loader">Syncing timeline data...</div>
        
        <div id="game-interface" style="display: none;">
            <div class="frame-window">
                <img id="game-poster" src="" alt="Anime Clue Frame">
            </div>

            <div class="dots-container" id="dots-container">
                <div class="dot unlocked active" data-index="0"></div>
                <div class="dot" data-index="1"></div>
                <div class="dot" data-index="2"></div>
                <div class="dot" data-index="3"></div>
                <div class="dot" data-index="4"></div>
                <div class="dot" data-index="5"></div>
            </div>

            <div class="guesses-log" id="guesses-log"></div>

            <div id="input-area">
                <div class="search-box">
                    <input type="text" id="anime-search" placeholder="Type anime title..." autocomplete="off">
                    <div class="autocomplete-dropdown" id="autocomplete-list"></div>
                </div>
                <div class="button-row" style="margin-top: 12px;">
                    <button class="btn-skip" id="btn-skip">SKIP</button>
                    <button class="btn-submit" id="btn-submit">SUBMIT</button>
                </div>
            </div>

            <div class="end-panel" id="end-panel">
                <h2 id="end-title" style="margin-top: 0;"></h2>
                <p id="end-meta" style="line-height: 1.5; color: #e4e4e7;"></p>
                <p style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0;">Next entry drops automatically at midnight.</p>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SEEDABLE PRNG SYSTEM ---
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3024734485, h3 = 3362453611, h4 = 502494348;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h4 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            return [(h1>>>0), (h2>>>0), (h3>>>0), (h4>>>0)];
        }

        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
                var t = (a + b) | 0;
                a = b ^ (b >>> 9);
                b = (c + (c << 3)) | 0;
                c = (c << 21) | (c >>> 11);
                d = (d + 1) | 0;
                t = (t + d) | 0;
                c = (c + t) | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        // --- 2. CONFIGURATION & STATE ---
        const MAX_GUESSES = 6;
        let currentStep = 0;
        let activeViewStep = 0;
        let targetAnime = null;
        let gameOver = false;
        let savedHistory = []; // Tracks structural log variables across sessions

        const todayStr = new Date().toISOString().split('T')[0];
        const puzzleId = todayStr.replace(/-/g, '');
        document.getElementById('current-date').innerText = `PUZZLE ID: ${puzzleId}`;
        
        const seed = cyrb128(todayStr);
        const rand = sfc32(seed[0], seed[1], seed[2], seed[3]);

        const ANIME_POOL_IDS = [
            7442, 1376, 3919, 11469, 12, 11, 6448, 41370, 42765, 5204, 
            11614, 176, 197, 1, 10740, 244, 1517, 6977, 8305, 8220, 
            11579, 3313, 8491, 43806, 45546, 44345, 46101, 22, 143, 226
        ];

        // --- 3. RUN APPLICATION INITIALIZER ---
        async function initGame() {
            try {
                const targetIdx = Math.floor(rand() * ANIME_POOL_IDS.length);
                const targetId = ANIME_POOL_IDS[targetIdx];

                const response = await fetch(`https://kitsu.io/api/edge/anime/${targetId}`);
                const json = await response.json();
                
                if(!json.data) throw new Error("Malformed payload data structures.");
                targetAnime = json.data.attributes;

                const posterImg = document.getElementById('game-poster');
                posterImg.src = targetAnime.posterImage.large || targetAnime.posterImage.original;

                // Load any historical data stored for today's puzzle context
                loadGameState();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('game-interface').style.display = 'block';

            } catch (err) {
                console.error("Initialization pipeline crashed: ", err);
                document.getElementById('loader').innerText = "Network extraction failed. Re-syncing tracking links...";
                setTimeout(initGame, 3000);
            }
        }

        // --- LOCAL STORAGE SYSTEM FUNCTIONS ---
        function saveGameState(status = "IN_PROGRESS") {
            const statePayload = {
                puzzleId: puzzleId,
                currentStep: currentStep,
                status: status, // "IN_PROGRESS", "WON", "LOST"
                history: savedHistory
            };
            localStorage.setItem('anime_framed_state', JSON.stringify(statePayload));
        }

        function loadGameState() {
            const rawData = localStorage.getItem('anime_framed_state');
            if (!rawData) {
                updateFrameView(0);
                return;
            }

            const parsed = JSON.parse(rawData);
            
            // Check if the saved state matches today's puzzle ID. If outdated, ignore it.
            if (parsed.puzzleId !== puzzleId) {
                localStorage.removeItem('anime_framed_state');
                updateFrameView(0);
                return;
            }

            // Reconstruct timeline steps and logs dynamically
            currentStep = parsed.currentStep;
            savedHistory = parsed.history;

            const dots = document.querySelectorAll('.dot');
            const trackingLogs = document.getElementById('guesses-log');

            savedHistory.forEach((logItem, idx) => {
                // Build layout log structures
                const logRow = document.createElement('div');
                logRow.className = `guess-row ${logItem.type}`;
                logRow.innerText = `Attempt ${idx + 1}: ${logItem.text}`;
                trackingLogs.appendChild(logRow);

                // Reassign timeline node colors
                if (logItem.type === 'correct') dots[idx].className = 'dot correct';
                else dots[idx].className = 'dot wrong';
            });

            if (parsed.status === "WON") {
                processEndgame(true, true);
            } else if (parsed.status === "LOST") {
                processEndgame(false, true);
            } else {
                // Game is still active; unlock the current step element
                for (let i = 0; i <= currentStep; i++) {
                    dots[i].classList.add('unlocked');
                }
                updateFrameView(currentStep);
            }
        }

        function updateFrameView(stepIndex) {
            if (!gameOver && stepIndex > currentStep) return; 
            activeViewStep = stepIndex;

            const posterImg = document.getElementById('game-poster');
            posterImg.className = '';
            posterImg.classList.add(`frame-style-${stepIndex}`);

            document.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === stepIndex);
            });
        }

        // --- 4. AUTOCOMPLETE LOGIC ---
        const searchInput = document.getElementById('anime-search');
        const autocompleteList = document.getElementById('autocomplete-list');
        let searchTimeout = null;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            
            if (query.length < 3) {
                autocompleteList.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const url = `https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(query)}&page[limit]=6`;
                    const res = await fetch(url);
                    const json = await res.json();
                    renderSearchDropdown(json.data);
                } catch(e) { console.error("Search index retrieval failed", e); }
            }, 300);
        });

        function renderSearchDropdown(items) {
            autocompleteList.innerHTML = '';
            if (!items) return;

            items.forEach(item => {
                const titleText = item.attributes.canonicalTitle;
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = titleText;
                div.addEventListener('click', () => {
                    searchInput.value = titleText;
                    autocompleteList.innerHTML = '';
                });
                autocompleteList.appendChild(div);
            });
        }

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) autocompleteList.innerHTML = '';
        });

        // --- 5. CORE LOOP EVALUATIONS ---
        const btnSubmit = document.getElementById('btn-submit');
        const btnSkip = document.getElementById('btn-skip');
        const dots = document.querySelectorAll('.dot');

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => updateFrameView(idx));
        });

        btnSubmit.addEventListener('click', () => {
            const currentGuess = searchInput.value.trim();
            if (!currentGuess) return;

            const parsedGuess = currentGuess.toLowerCase();
            const validTitles = [
                targetAnime.canonicalTitle?.toLowerCase(),
                targetAnime.titles.en?.toLowerCase(),
                targetAnime.titles.en_jp?.toLowerCase()
            ].filter(Boolean);

            const checkMatches = validTitles.includes(parsedGuess);
            evaluateRoundResult(checkMatches, currentGuess);
        });

        btnSkip.addEventListener('click', () => {
            evaluateRoundResult(false, "Skipped Frame", true);
        });

        function evaluateRoundResult(isCorrect, loggedText, wasSkipped = false) {
            if (gameOver) return;

            const typeStr = isCorrect ? 'correct' : (wasSkipped ? 'skipped' : 'wrong');
            savedHistory.push({ text: loggedText, type: typeStr });

            const trackingLogs = document.getElementById('guesses-log');
            const logRow = document.createElement('div');
            logRow.className = `guess-row ${typeStr}`;
            logRow.innerText = `Attempt ${currentStep + 1}: ${loggedText}`;
            trackingLogs.appendChild(logRow);

            const activeDotMarker = dots[currentStep];

            if (isCorrect) {
                activeDotMarker.className = 'dot correct';
                saveGameState("WON");
                processEndgame(true);
                return;
            } else {
                activeDotMarker.className = 'dot wrong';
                currentStep++;
                
                if (currentStep < MAX_GUESSES) {
                    dots[currentStep].classList.add('unlocked');
                    updateFrameView(currentStep);
                    searchInput.value = '';
                    saveGameState("IN_PROGRESS");
                } else {
                    saveGameState("LOST");
                    processEndgame(false);
                }
            }
        }

        function processEndgame(victory, loadedFromStorage = false) {
            gameOver = true;
            searchInput.disabled = true;
            btnSubmit.disabled = true;
            btnSkip.disabled = true;
            document.getElementById('input-area').style.display = 'none';

            const summaryPanel = document.getElementById('end-panel');
            const endTitle = document.getElementById('end-title');
            const endMeta = document.getElementById('end-meta');

            summaryPanel.style.display = 'block';
            
            if (victory) {
                endTitle.innerText = "🏆 Clear Verification!";
                endTitle.style.color = "var(--success-color)";
            } else {
                endTitle.innerText = "⚡ Connection Terminated";
                endTitle.style.color = "var(--fail-color)";
            }

            endMeta.innerHTML = `The correct answer was:<br><span style="font-size:1.3rem; font-weight:800; color:#fff;">${targetAnime.canonicalTitle}</span>`;
            
            dots.forEach(dot => dot.classList.add('unlocked'));
            updateFrameView(5);
        }

        initGame();
    </script>
</body>
</html>
