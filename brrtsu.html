<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniList + Kitsu AutoBrr Filter Gen</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #27272a;
            --border-focus: #3f3f46;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify(content): center;
            padding: 40px 20px;
            margin: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--surface);
            width: 100%;
            max-width: 980px;
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0 0 32px;
            font-size: 15px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border);
            margin: 0 16px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea.batch-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        textarea.batch-input {
            flex-grow: 1;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: 15px;
            outline: none;
            resize: vertical;
            min-height: 50px;
            height: 100px;
            font-family: inherit;
            margin-top: 0;
        }

        button {
            padding: 14px 24px;
            cursor: pointer;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover:not(:disabled) { 
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled { 
            opacity: 0.5;
            cursor: not-allowed; 
            transform: none;
        }

        .secondary-btn { 
            background: var(--surface-hover);
            color: var(--text); 
            border: 1px solid var(--border);
        }

        .options {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin: 32px 0;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
        }

        .option input[type="checkbox"] { 
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        
        .option strong { 
            display: block;
            font-size: 14px; 
            margin-bottom: 4px;
        }
        
        .option span span { 
            display: block;
            color: var(--text-muted); 
            font-size: 13px; 
        }

        .status {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 16px;
            min-height: 20px;
        }

        .status.success { color: var(--success); }
        .status.error { color: var(--error); }
        .status.warning { color: var(--warning); }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(440px, calc(100vw - 40px));
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            cursor: pointer;
        }

        .toast-title { display: block; font-weight: 700; margin-bottom: 3px; }
        .toast-message { color: var(--text-muted); font-size: 13px; }

        .progress-wrap {
            display: none;
            height: 6px;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        textarea.output-area {
            width: 100%;
            height: 300px;
            margin-top: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: monospace;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
        }

        .button-row { display: flex; gap: 12px; margin-top: 16px; }
        #copyBtn { display: none; background: var(--success); flex: 1; }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 24px 0;
        }

        .metric {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .metric-value { font-size: 28px; font-weight: 700; }
        .metric-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }

        .log {
            margin-top: 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg);
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }

        .log-line { padding: 10px 16px; border-bottom: 1px solid var(--surface); font-family: monospace; font-size: 12px; word-break: break-all; }
        .log-line.ok { color: var(--success); }
        .log-line.warn { color: var(--warning); }
        .log-line.err { color: var(--error); }

        .seasonal-truth-block { margin: 0 0 20px; }
        .field-label { display: block; margin: 0 0 8px; color: var(--text-muted); font-size: 13px; font-weight: 700; text-transform: uppercase; }
        textarea.seasonal-truth-input { width: 100%; height: 120px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text); resize: vertical; margin-top: 0; font-family: monospace; font-size: 13px; }
        .input-help { margin-top: 8px; color: var(--text-muted); font-size: 13px; }

        @media (max-width: 760px) {
            .input-group, .button-row { flex-direction: column; }
            .card { padding: 24px; }
        }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div class="card">
    <h1>AniList + Kitsu AutoBrr</h1>
    <p class="subtitle">Enter an AniList username to pull CURRENT anime, or match a batch of specific shows.</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="AniList Username">
        <button id="generateBtn" type="button">Generate User List</button>
    </div>

    <div class="seasonal-truth-block">
        <label class="field-label" for="seasonalTruthInput">Seasonal source names (optional)</label>
        <textarea id="seasonalTruthInput" class="seasonal-truth-input" placeholder="Paste the seasonal text list here..."></textarea>
        <div class="input-help">Matched names override API defaults. Unmatched fall back gracefully.</div>
    </div>

    <div class="divider">OR</div>

    <div class="input-group">
        <textarea id="singleShowInput" class="batch-input" placeholder="Paste AniList URLs, IDs, or Anime Names (one per line or comma-separated)"></textarea>
        <button id="generateSingleBtn" type="button" class="secondary-btn" style="height: fit-content; align-self: flex-start;">Match Show(s)</button>
    </div>

    <div class="options">
        <label class="option">
            <input type="checkbox" id="useKitsu" checked>
            <span><strong>Enrich with Kitsu titles</strong><span>Maps MAL IDs and falls back to fuzzy text search.</span></span>
        </label>
        <label class="option">
            <input type="checkbox" id="includeNonAscii">
            <span><strong>Include native titles</strong><span>Off by default to avoid Japanese-script filters.</span></span>
        </label>
        <label class="option">
            <input type="checkbox" id="shortDescriptorVariants" checked>
            <span><strong>Add shortened variants</strong><span>Drops trailing tags like Arc, Saga, Chapter, Hen.</span></span>
        </label>
        <label class="option">
            <input type="checkbox" id="showLog" checked>
            <span><strong>Show match log</strong><span>Displays internal verification streams.</span></span>
        </label>
    </div>

    <div id="status" class="status"></div>
    <div id="progressWrap" class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>

    <div class="summary" id="summary" style="display:none;">
        <div class="metric"><div class="metric-value" id="animeCount">0</div><div class="metric-label">Anime</div></div>
        <div class="metric"><div class="metric-value" id="kitsuAddedCount">0</div><div class="metric-label">Kitsu Additions</div></div>
        <div class="metric"><div class="metric-value" id="patternCount">0</div><div class="metric-label">Patterns</div></div>
        <div class="metric"><div class="metric-value" id="charCount">0</div><div class="metric-label">Chars</div></div>
    </div>

    <textarea id="output" class="output-area" readonly placeholder="Filter will appear here..."></textarea>

    <div class="button-row">
        <button id="copyBtn" type="button">Copy Filter</button>
        <button id="clearCacheBtn" type="button" class="secondary-btn">Clear Cache</button>
    </div>
    <div id="log" class="log"></div>
</div>

<script>
    const ANILIST_API_URL = 'https://graphql.anilist.co';
    const KITSU_API_URL = 'https://kitsu.io/api/edge';
    const KITSU_DELAY_MS = 500; 
    const KITSU_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000;
    const KITSU_FALLBACK_ACCEPT_SCORE = 70;

    const els = {
        username: document.getElementById('username'),
        generateBtn: document.getElementById('generateBtn'),
        seasonalTruthInput: document.getElementById('seasonalTruthInput'),
        singleShowInput: document.getElementById('singleShowInput'),
        generateSingleBtn: document.getElementById('generateSingleBtn'),
        useKitsu: document.getElementById('useKitsu'),
        includeNonAscii: document.getElementById('includeNonAscii'),
        shortDescriptorVariants: document.getElementById('shortDescriptorVariants'),
        showLog: document.getElementById('showLog'),
        status: document.getElementById('status'),
        progressWrap: document.getElementById('progressWrap'),
        progressBar: document.getElementById('progressBar'),
        summary: document.getElementById('summary'),
        animeCount: document.getElementById('animeCount'),
        kitsuAddedCount: document.getElementById('kitsuAddedCount'),
        patternCount: document.getElementById('patternCount'),
        charCount: document.getElementById('charCount'),
        output: document.getElementById('output'),
        copyBtn: document.getElementById('copyBtn'),
        clearCacheBtn: document.getElementById('clearCacheBtn'),
        log: document.getElementById('log'),
        toastContainer: document.getElementById('toastContainer')
    };
    
    let lastKitsuRequestAt = 0;
    let aniListCooldownUntil = 0;

    const isEnglishFriendly = (value) => {
        const folded = String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
        return /[a-z]/i.test(folded);
    };
    
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    function safeGetItem(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function safeSetItem(key, value) { try { localStorage.setItem(key, value); } catch {} }
    function safeRemoveItem(key) { try { localStorage.removeItem(key); } catch {} }

    function setStatus(message, type = '') {
        els.status.textContent = message;
        els.status.className = `status ${type}`.trim();
    }

    function showToast(message, type = 'warning', title = 'Warning') {
        if (!els.toastContainer) return;
        const toast = document.createElement('div');
        toast.className = `toast ${type}`.trim();
        toast.innerHTML = `<span class="toast-title">${title}</span><div class="toast-message">${message}</div>`;
        toast.addEventListener('click', () => toast.remove());
        els.toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 8000);
    }

    function setProgress(done, total) {
        if (!total) { els.progressWrap.style.display = 'none'; return; }
        els.progressWrap.style.display = 'block';
        els.progressBar.style.width = `${Math.min(100, Math.round((done / total) * 100))}%`;
    }

    function resetUi() {
        els.output.value = '';
        els.copyBtn.style.display = 'none';
        els.summary.style.display = 'none';
        els.log.innerHTML = '';
        els.log.style.display = els.showLog.checked ? 'block' : 'none';
        setProgress(0, 0);
    }

    function logLine(message, kind = '') {
        if (!els.showLog.checked) return;
        els.log.style.display = 'block';
        const div = document.createElement('div');
        div.className = `log-line ${kind}`.trim();
        div.textContent = message;
        els.log.appendChild(div);
        els.log.scrollTop = els.log.scrollHeight;
    }

    function toggleButtons(disabled) {
        els.generateBtn.disabled = disabled;
        els.generateSingleBtn.disabled = disabled;
        els.clearCacheBtn.disabled = disabled;
    }

    function foldForWildcard(value) {
        return String(value).normalize('NFC').replace(/[×]/g, ' x ').replace(/&/g, ' and ').replace(/\+/g, ' plus ').replace(/[–—]/g, '-');
    }

    function wildcardTokens(value) {
        return foldForWildcard(value).toLowerCase().match(/[a-z0-9]+/g) || [];
    }

    function toWildcardPattern(title) {
        const tokens = wildcardTokens(title);
        if (!tokens.length) return '';
        return tokens.join('*').replace(/\*+/g, '*');
    }

    function addPattern(patterns, rawPattern) {
        const pattern = String(rawPattern || '').trim().replace(/\*+/g, '*');
        if (!pattern) return;
        const compactLength = pattern.replace(/[?*]/g, '').length;
        if (compactLength === 0) return;
        if (compactLength <= 3 && !/[?*]/.test(pattern)) { patterns.add(pattern); return; }
        if (compactLength <= 3) return;
        patterns.add(`*${pattern}*`.replace(/\*+/g, '*'));
    }

    function normalizeForCompare(value) { return wildcardTokens(value).join(' '); }
    function compactCompare(value) { return wildcardTokens(value).join(''); }

    function uniqueNonEmpty(items) {
        const seen = new Set();
        return items.map(i => String(i || '').trim()).filter(v => v && !seen.has(v.toLowerCase()) && seen.add(v.toLowerCase()));
    }

    function collectAniListTitles(media, options) {
        const titles = [
            media.title?.romaji,
            media.title?.english,
            media.title?.userPreferred,
            ...(options.includeNonAscii ? [media.title?.native] : []),
            ...(Array.isArray(media.synonyms) ? media.synonyms : [])
        ];
        return filterTitleListForAscii(titles, options);
    }

    function collectKitsuTitles(item, options) {
        const attrs = item?.attributes || {};
        const titlesObj = attrs.titles || {};
        const titles = [
            attrs.canonicalTitle,
            titlesObj.en,
            titlesObj.en_jp,
            ...(options.includeNonAscii ? [titlesObj.ja_jp] : []),
            ...(Array.isArray(attrs.abbreviatedTitles) ? attrs.abbreviatedTitles : [])
        ];
        return filterTitleListForAscii(titles, options);
    }

    function ordinalSuffix(n) {
        const num = Number(n); if (!Number.isFinite(num)) return `${n}th`;
        const mod100 = num % 100; if (mod100 >= 11 && mod100 <= 13) return `${num}th`;
        switch (num % 10) { case 1: return `${num}st`; case 2: return `${num}nd`; case 3: return `${num}rd`; default: return `${num}th`; }
    }
    function ordinalWord(n) { return { 1: 'first', 2: 'second', 3: 'third', 4: 'fourth', 5: 'fifth', 6: 'sixth', 7: 'seventh', 8: 'eighth', 9: 'ninth', 10: 'tenth' }[Number(n)] || null; }
    function romanNumeral(n) { return { 1: 'i', 2: 'ii', 3: 'iii', 4: 'iv', 5: 'v', 6: 'vi', 7: 'vii', 8: 'viii', 9: 'ix', 10: 'x' }[Number(n)] || null; }
    function stripTrailingSeparators(value) { return String(value).replace(/[\s:;,\.\-–—_]+$/g, '').replace(/^[\s:;,\.\-–—_]+/g, '').trim(); }

    function expandBasicTitleVariants(title) {
        const variants = new Set([title]);
        const original = String(title || '').trim(); if (!original) return variants;
        variants.add(original.replace(/[’'`´]/g, ''));
        variants.add(original.replace(/\s*&\s*/g, ' and '));
        variants.add(original.replace(/\s*&\s*/g, ' '));
        variants.add(original.replace(/^(the|a|an)\s+/i, ''));
        return new Set([...variants].map(v => v.trim()).filter(Boolean));
    }

    function getSeasonInfo(title) {
        const folded = normalizeForCompare(title).toLowerCase();
        const match = folded.match(/\b(?:season|part|cour)\s*0*(\d+)\b/i) || folded.match(/\b0*(\d+)(?:st|nd|rd|th)\s+(?:season|part|cour)\b/i) || folded.match(/\bs0*(\d+)\b/i) || folded.match(/\s+0*(\d+)$/); 
        if (!match) return null;
        const n = Number(match[1]); if (!Number.isInteger(n) || n < 1 || n > 99) return null;
        const rootTitle = stripTrailingSeparators(String(title).replace(/\b(?:season|part|cour)\s*0*\d+\b/ig, '').replace(/\b0*\d+(?:st|nd|rd|th)\s+(?:season|part|cour)\b/ig, '').replace(/\bs0*\d+\b/ig, '').replace(/\s+0*\d+$/g, ''));
        return rootTitle ? { rootTitle, n } : null;
    }

    function expandSeasonVariants(title) {
        const info = getSeasonInfo(title); if (!info) return new Set();
        const { rootTitle, n } = info; const padded = String(n).padStart(2, '0');
        const ordinal = ordinalSuffix(n); const ordinalAsWord = ordinalWord(n); const roman = romanNumeral(n);
        const variants = new Set([rootTitle, `${rootTitle} ${n}`, `${rootTitle} ${ordinal} season`, `${rootTitle} season ${n}`, `${rootTitle} part ${n}`, `${rootTitle} cour ${n}`, `${rootTitle} s${n}`, `${rootTitle} s${padded}`, `${rootTitle} season${n}`, `${rootTitle} season${padded}`]);
        if (ordinalAsWord) variants.add(`${rootTitle} ${ordinalAsWord} season`);
        if (roman) { variants.add(`${rootTitle} ${roman}`); variants.add(`${rootTitle} season ${roman}`); variants.add(`${rootTitle} part ${roman}`); }
        return new Set([...variants].map(v => v.trim()).filter(Boolean));
    }

    function expandTrailingDescriptorVariants(title) {
        const variants = new Set([title]); const original = String(title || '').trim();
        const shortened = original.replace(/[\s:._-]+(arc|hen|saga|chapter|story|movie|film)$/i, '').trim();
        if (shortened !== original && compactCompare(shortened).length >= 8) variants.add(shortened);
        return variants;
    }

    function makeTitleVariants(title, options) {
        const variants = new Set(); const original = String(title || '').trim(); if (!original) return [];
        const subtitleVariants = new Set([original]);
        const parts = original.split(/[:\-~]/); if (parts.length > 1 && parts[0].trim().length >= 5) subtitleVariants.add(parts[0].trim());
        const seasonMatch = original.match(/^(.*?(?:season|part|cour)\s*\d+)\b/i) || original.match(/^(.*?\d+(?:st|nd|rd|th)\s+(?:season|part|cour))\b/i);
        if (seasonMatch) subtitleVariants.add(seasonMatch[1].trim());

        const descriptorVariants = new Set();
        subtitleVariants.forEach(sv => { if (options.shortDescriptorVariants) expandTrailingDescriptorVariants(sv).forEach(v => descriptorVariants.add(v)); else descriptorVariants.add(sv); });
        descriptorVariants.forEach(dv => { expandBasicTitleVariants(dv).forEach(v => variants.add(v)); expandSeasonVariants(dv).forEach(sv => { expandBasicTitleVariants(sv).forEach(v => variants.add(v)); }); });
        return uniqueNonEmpty([...variants]);
    }

    function filterTitleListForAscii(titles, options) { 
        const unique = uniqueNonEmpty(titles); 
        return options.includeNonAscii ? unique : unique.filter(isEnglishFriendly); 
    }

    function tokenOverlapScore(a, b) {
        const aTokens = new Set(wildcardTokens(a)); const bTokens = new Set(wildcardTokens(b)); if (!aTokens.size || !bTokens.size) return 0;
        let intersection = 0; aTokens.forEach(t => { if (bTokens.has(t)) intersection++; });
        return Math.round((intersection / Math.min(aTokens.size, bTokens.size) * 60) + (intersection / Math.max(aTokens.size, bTokens.size) * 30));
    }

    function scoreKitsuCandidate(anilistTitles, item, media, options) {
        const kitsuTitles = collectKitsuTitles(item, options);
        const aniNorm = anilistTitles.map(normalizeForCompare).filter(Boolean); const kitsuNorm = kitsuTitles.map(normalizeForCompare).filter(Boolean);
        const aniComp = anilistTitles.map(compactCompare).filter(Boolean); const kitsuComp = kitsuTitles.map(compactCompare).filter(Boolean);
        let best = 0;
        for (const a of aniNorm) { for (const k of kitsuNorm) { if (a === k) best = Math.max(best, 100); else if (a.includes(k) || k.includes(a)) best = Math.max(best, 85); else best = Math.max(best, tokenOverlapScore(a, k)); } }
        for (const a of aniComp) { for (const k of kitsuComp) { if (a === k) best = Math.max(best, 96); } }
        const aniYear = media?.startDate?.year; const start = item?.attributes?.startDate; const kitsuYear = start ? parseInt(start.match(/^(\d{4})/)?.[1], 10) : null;
        if (aniYear && kitsuYear) { if (aniYear === kitsuYear) best += 5; else if (Math.abs(aniYear - kitsuYear) >= 2) best -= 12; }
        return Math.max(0, Math.min(100, best));
    }

    function kitsuCacheGet(key) {
        const raw = safeGetItem(key); if (!raw) return null;
        try { const p = JSON.parse(raw); if (!p || Date.now() - p.savedAt > KITSU_CACHE_TTL_MS) { safeRemoveItem(key); return null; } return p.value; } catch { safeRemoveItem(key); return null; }
    }
    function kitsuCacheSet(key, value) { safeSetItem(key, JSON.stringify({ savedAt: Date.now(), value })); }

    async function throttledKitsuFetch(url, retries = 3) {
        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                const now = Date.now(); 
                const elapsed = now - lastKitsuRequestAt; 
                if (elapsed < KITSU_DELAY_MS) await sleep(KITSU_DELAY_MS - elapsed);
                lastKitsuRequestAt = Date.now();
                
                const res = await fetch(url, { headers: { 'Accept': 'application/vnd.api+json' } });
                let result;
                try {
                    result = await res.json();
                } catch (e) {
                    result = null;
                }
                
                if (!res.ok) throw new Error(result?.errors?.[0]?.detail || `Kitsu error HTTP ${res.status}`);
                return result;
            } catch (err) {
                if (attempt === retries) throw err;
                // Gracefully pause slightly longer on each step before retry
                await sleep(800 * attempt);
            }
        }
    }

    async function getKitsuByMalId(malId) {
        const key = `autobrr:kitsu:v3:mal:${malId}`; const cached = kitsuCacheGet(key); if (cached) return { item: cached, fromCache: true };
        const result = await throttledKitsuFetch(`${KITSU_API_URL}/mappings?filter[externalSite]=myanimelist/anime&filter[externalId]=${encodeURIComponent(malId)}&include=item`);
        const item = result?.included?.find(x => x.type === 'anime') || null; if (item) kitsuCacheSet(key, item);
        return { item, fromCache: false };
    }

    async function searchKitsu(searchTerm) {
        const key = `autobrr:kitsu:v3:search:${normalizeForCompare(searchTerm)}`; const cached = kitsuCacheGet(key); if (cached) return { items: cached, fromCache: true };
        const result = await throttledKitsuFetch(`${KITSU_API_URL}/anime?filter[text]=${encodeURIComponent(searchTerm)}&page[limit]=5`);
        const items = Array.isArray(result?.data) ? result.data : []; kitsuCacheSet(key, items);
        return { items, fromCache: false };
    }

    async function enrichWithKitsu(media, anilistTitles, options) {
        if (media.idMal) {
            try {
                const { item, fromCache } = await getKitsuByMalId(media.idMal);
                if (item) {
                    return { 
                        titles: collectKitsuTitles(item, options), 
                        status: 'ok', 
                        message: `${displayNameForMedia(media)}: mapped MAL ID ${media.idMal} via Kitsu${fromCache ? ' (cached)' : ''}.` 
                    };
                }
            } catch (e) {
                logLine(`${displayNameForMedia(media)}: Kitsu MAL mapping skipped: ${e.message}`, 'warn');
            }
        }
        
        let baseTerms = [
            media.title?.english,
            media.title?.romaji,
            media.title?.userPreferred,
            ...(Array.isArray(media.synonyms) ? media.synonyms : [])
        ];

        // Advanced string parsing: Generate versions with colons/dashes stripped for finicky search indexes
        const cleanExtras = baseTerms
            .filter(t => t && (t.includes(':') || t.includes('-')))
            .map(t => t.replace(/[:\-]+/g, ' ').replace(/\s+/g, ' ').trim());

        const searchTerms = uniqueNonEmpty([...baseTerms, ...cleanExtras]).slice(0, 4); 

        for (const term of searchTerms) {
            if (!term) continue;
            try {
                const { items, fromCache } = await searchKitsu(term);
                if (!items || !items.length) continue;

                const scored = items.map(item => ({ 
                    item, 
                    score: scoreKitsuCandidate(anilistTitles, item, media, options) 
                })).sort((a, b) => b.score - a.score);

                if (scored[0] && scored[0].score >= KITSU_FALLBACK_ACCEPT_SCORE) {
                    return { 
                        titles: collectKitsuTitles(scored[0].item, options), 
                        status: 'ok', 
                        message: `${displayNameForMedia(media)}: fuzzy Kitsu match via "${term}" (score: ${scored[0].score})${fromCache ? ' (cached)' : ''}.` 
                    };
                }
            } catch (innerErr) { }
        }

        return { 
            titles: [], 
            status: 'miss', 
            message: `${displayNameForMedia(media)}: no match found on Kitsu via MAL ID or text queries.` 
        };
    }

    async function fetchSingleAniListAnime(id) {
        if (Date.now() < aniListCooldownUntil) await sleep(aniListCooldownUntil - Date.now());
        const query = `query ($id: Int) { Media(id: $id, type: ANIME) { id idMal siteUrl format startDate { year } title { romaji english native userPreferred } synonyms } }`;
        
        const res = await fetch(ANILIST_API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
            body: JSON.stringify({ query, variables: { id } }) 
        });
        
        if (res.status === 429) { 
            const r = Number(res.headers.get('Retry-After')) || 60; 
            aniListCooldownUntil = Date.now() + (r * 1000); 
            throw new Error("Rate limited by AniList. Pausing..."); 
        }
        
        let r;
        try {
            r = await res.json();
        } catch (e) {
            throw new Error(`API returned an unreadable response (HTTP ${res.status}). The ID might be invalid or network blocked.`);
        }
        
        if (!res.ok || r.errors) {
            throw new Error(r.errors?.[0]?.message || `AniList lookup failed (HTTP ${res.status}).`);
        }
        
        return r.data?.Media;
    }

    async function fetchAniListAnimeBySearch(search) {
        if (Date.now() < aniListCooldownUntil) await sleep(aniListCooldownUntil - Date.now());
        const query = `query ($search: String) { Media(search: $search, type: ANIME) { id idMal siteUrl format startDate { year } title { romaji english native userPreferred } synonyms } }`;
        
        const res = await fetch(ANILIST_API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
            body: JSON.stringify({ query, variables: { search } }) 
        });
        
        let r;
        try {
            r = await res.json();
        } catch (e) {
            throw new Error(`API returned an unreadable response (HTTP ${res.status}).`);
        }

        if (!res.ok || r.errors) return null; 
        return r.data?.Media;
    }

    async function fetchAniListCurrent(username) {
        if (Date.now() < aniListCooldownUntil) await sleep(aniListCooldownUntil - Date.now());
        const query = `query ($name: String) { MediaListCollection(userName: $name, type: ANIME, status: CURRENT) { lists { entries { media { id idMal siteUrl format startDate { year } title { romaji english native userPreferred } synonyms } } } } }`;
        const res = await fetch(ANILIST_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ query, variables: { name: username } }) });
        if (res.status === 429) { const r = Number(res.headers.get('Retry-After')) || 60; aniListCooldownUntil = Date.now() + (r * 1000); throw new Error("AniList rate limit. Pausing..."); }
        const r = await res.json(); if (!res.ok || r.errors) throw new Error(r.errors?.[0]?.message || 'AniList request failed.');
        const out = []; r.data?.MediaListCollection?.lists?.forEach(l => l.entries?.forEach(e => { if (e.media) out.push(e.media); }));
        return out;
    }

    function buildFilterPatterns(mediaTitleMap, options) {
        const patterns = new Set();
        for (const [_, titles] of mediaTitleMap.entries()) {
            titles.forEach(t => { makeTitleVariants(t, options).forEach(v => { addPattern(patterns, toWildcardPattern(v)); }); });
        }
        return [...patterns].sort((a, b) => a.replace(/^\*/, '').localeCompare(b.replace(/^\*/, '')));
    }

    function cleanSeasonalTruthLine(line) {
        let v = String(line || '').trim(); if (!v || /^https?:\/\//i.test(v)) return '';
        v = v.replace(/^\s*(?:[-*•]+|\d+[.)])\s*/u, '').replace(/^\s*\[[^\]]+\]\s*/u, '').replace(/\s+/g, ' ').trim();
        const rm = v.match(/^(?:\[[^\]]+\]\s*)?(.+?)\s+-\s+\d+/i); if (rm?.[1]) v = rm[1].trim();
        v = v.replace(/\s+\[(?:new|ongoing|tv|ona|ova|movie)\]\s*$/i, '').replace(/\s+\((?:tv|ona|ova|movie|\d{4})\)\s*$/i, '').trim();
        return v.length >= 3 ? v : '';
    }

    function parseSeasonalTruthInput(raw) { return uniqueNonEmpty(String(raw || '').replace(/\r\n?/g, '\n').split('\n').map(cleanSeasonalTruthLine)); }
    function displayNameForMedia(m) { return m?.title?.userPreferred || m?.title?.english || m?.title?.romaji || `ID: ${m?.id}`; }

    async function processMediaList(mediaList, options) {
        const mediaTitleMap = new Map();
        mediaList.forEach(m => mediaTitleMap.set(m.id, collectAniListTitles(m, options)));

        let kitsuAdded = 0; setProgress(0, mediaList.length);
        for (let i = 0; i < mediaList.length; i++) {
            const media = mediaList[i];
            setStatus(`Enriching indices: ${i + 1}/${mediaList.length} — ${displayNameForMedia(media)}`);
            if (options.useKitsu) {
                try {
                    const current = mediaTitleMap.get(media.id) || [];
                    const enr = await enrichWithKitsu(media, current, options);
                    const merged = uniqueNonEmpty([...current, ...enr.titles]);
                    mediaTitleMap.set(media.id, merged); kitsuAdded += Math.max(0, merged.length - current.length);
                    logLine(enr.message, enr.status === 'ok' ? 'ok' : 'warn');
                } catch (e) { logLine(`${displayNameForMedia(media)}: Kitsu error: ${e.message}`, 'err'); }
            }
            setProgress(i + 1, mediaList.length);
        }

        const patterns = buildFilterPatterns(mediaTitleMap, options);
        const finalStr = patterns.join(','); els.output.value = finalStr;

        els.copyBtn.style.display = 'block'; els.summary.style.display = 'grid';
        els.animeCount.textContent = mediaList.length; els.kitsuAddedCount.textContent = kitsuAdded;
        els.patternCount.textContent = patterns.length; els.charCount.textContent = finalStr.length;
        setStatus('AutoBrr filters successfully compiled!', 'success');
    }

    async function generateUserFilter() {
        const username = els.username.value.trim(); if (!username) { setStatus('Enter username.', 'error'); return; }
        const rawTruth = els.seasonalTruthInput.value; const truthTitles = parseSeasonalTruthInput(rawTruth);
        const options = { useKitsu: els.useKitsu.checked, includeNonAscii: els.includeNonAscii.checked, shortDescriptorVariants: els.shortDescriptorVariants.checked, seasonalTruthTitles: truthTitles };
        resetUi(); toggleButtons(true); setStatus('Querying user catalog...');
        try {
            const list = await fetchAniListCurrent(username);
            if (!list.length) throw new Error('No items active with status CURRENT found.');
            await processMediaList(list, options);
        } catch (e) { setStatus(`Error: ${e.message}`, 'error'); } finally { toggleButtons(false); setProgress(0,0); }
    }

    async function generateSingleFilter() {
        const rawInput = els.singleShowInput.value.trim();
        if (!rawInput) { setStatus('Enter IDs, URLs, or Names.', 'error'); return; }
        
        const items = rawInput.split(/[\n,]+/).map(i => i.trim()).filter(Boolean);
        if (!items.length) { setStatus('No valid items found.', 'error'); return; }

        const rawTruth = els.seasonalTruthInput.value;
        const truthTitles = parseSeasonalTruthInput(rawTruth);

        const options = { 
            useKitsu: els.useKitsu.checked, 
            includeNonAscii: els.includeNonAscii.checked, 
            shortDescriptorVariants: els.shortDescriptorVariants.checked,
            seasonalTruthTitles: truthTitles 
        };
        
        resetUi(); 
        toggleButtons(true); 
        setStatus('Processing batch list...');
        
        const collectedMedia = [];
        let missedCount = 0;
        
        try {
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                setStatus(`Querying AniList (${i + 1}/${items.length}): ${item}`);
                
                let mediaId = null;
                const urlMatch = item.match(/anilist\.co\/anime\/(\d+)/i);
                
                if (urlMatch) {
                    mediaId = parseInt(urlMatch[1], 10);
                } else if (/^\d+$/.test(item)) {
                    mediaId = parseInt(item, 10);
                }
                
                try {
                    let target = null;
                    if (mediaId && !isNaN(mediaId)) {
                        target = await fetchSingleAniListAnime(mediaId);
                    } else {
                        target = await fetchAniListAnimeBySearch(item);
                    }
                    
                    if (target) {
                        collectedMedia.push(target);
                    } else {
                        logLine(`AniList returned no matching results for: "${item}"`, 'warn');
                        missedCount++;
                    }
                } catch (innerErr) {
                    logLine(`Error fetching "${item}": ${innerErr.message}`, 'err');
                    missedCount++;
                }
            }
            
            if (!collectedMedia.length) throw new Error('No valid anime data could be recovered from your list.');
            if (missedCount > 0) showToast(`Failed to match ${missedCount} items. Check logs for details.`, 'warning', 'Partial Success');
            
            await processMediaList(collectedMedia, options);
            
        } catch (e) { 
            setStatus(`Error: ${e.message}`, 'error'); 
        } finally { 
            toggleButtons(false); 
            setProgress(0,0); 
        }
    }

    async function copyToClipboard() {
        try { await navigator.clipboard.writeText(els.output.value); } catch { els.output.select(); document.execCommand('copy'); }
        const old = els.copyBtn.textContent; els.copyBtn.textContent = 'Copied!'; setTimeout(() => { els.copyBtn.textContent = old; }, 1500);
    }

    function clearKitsuCache() {
        let c = 0; for(let i=localStorage.length-1; i>=0; i--) { const k = localStorage.key(i); if(k&&k.startsWith('autobrr:kitsu:')) { localStorage.removeItem(k); c++; } }
        setStatus(`Cleared ${c} cache indexes.`, 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const sn = safeGetItem('anilist_username'); if (sn) els.username.value = sn;
        els.generateBtn.addEventListener('click', generateUserFilter);
        els.generateSingleBtn.addEventListener('click', generateSingleFilter);
        els.copyBtn.addEventListener('click', copyToClipboard);
        els.clearCacheBtn.addEventListener('click', clearKitsuCache);
    });
</script>
