name: Publish site with date-aware SubsPlease schedule

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-json-schedule
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage existing site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/_site/' \
            ./ _site/

      - name: Fetch SubsPlease weekday schedule
        shell: bash
        run: |
          set -euo pipefail

          # h=true is TODAY'S widget, not a date-specific API. Its date query
          # parameter is ignored. Fetch the full weekday-keyed timetable once.
          weekly_file="$(mktemp)"
          trap 'rm -f "$weekly_file"' EXIT

          # Europe/Berlin and UTC responses can already contain an extra hour
          # for weekdays on the other side of the source clock's DST change.
          # The Pacific-clock response matches the independently dated releases.
          # Anchor that clock to the fetch instant,
          # then convert the resulting UTC slots separately for each date.
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --user-agent 'AiringBoard-WeekdaySchedule/3.0' \
            --output "$weekly_file" \
            'https://subsplease.org/api/?f=schedule&tz=America%2FLos_Angeles'

          python3 - "$weekly_file" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" <<'PY'
          import json
          import re
          import sys
          from datetime import datetime, time, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
          source_zone = ZoneInfo("America/Los_Angeles")
          display_zone = ZoneInfo("Europe/Berlin")
          fetched_at = datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
          source_offset = int(fetched_at.astimezone(source_zone).utcoffset().total_seconds() / 60)
          raw = json.loads(Path(sys.argv[1]).read_text())
          schedule = raw.get("schedule")
          if raw.get("tz") != source_zone.key or not isinstance(schedule, dict):
              raise ValueError("Expected a full America/Los_Angeles weekday schedule")

          utc_slots = {day: [] for day in range(7)}
          for day_index, day in enumerate(weekdays):
              rows = schedule.get(day)
              if not isinstance(rows, list):
                  raise ValueError(f"Missing weekday: {day}")
              for row in rows:
                  if not isinstance(row, dict) or not isinstance(row.get("title"), str) or not row["title"].strip():
                      raise ValueError(f"Invalid show on {day}")
                  clock = row.get("time")
                  if not isinstance(clock, str) or not re.fullmatch(r"([01]\d|2[0-3]):[0-5]\d", clock):
                      raise ValueError(f"Invalid show time on {day}")
                  hour, minute = map(int, clock.split(":"))
                  utc_minute = (day_index * 1440 + hour * 60 + minute - source_offset) % (7 * 1440)
                  utc_slots[utc_minute // 1440].append((row, utc_minute % 1440))
          if not any(utc_slots.values()):
              raise ValueError("Schedule contains no shows")

          today = fetched_at.astimezone(display_zone).date()
          range_start = today - timedelta(days=today.weekday())
          days = []
          for offset in range(9):
              date = range_start + timedelta(days=offset)
              days.append({"date": date.isoformat(), "day": weekdays[date.weekday()], "schedule": []})
          by_date = {block["date"]: block for block in days}

          # Pad UTC dates so conversion across midnight never loses a show.
          for offset in range(-1, 10):
              date = range_start + timedelta(days=offset)
              for row, utc_minute in utc_slots[date.weekday()]:
                  instant = datetime.combine(date, time(utc_minute // 60, utc_minute % 60), tzinfo=timezone.utc)
                  local = instant.astimezone(display_zone)
                  block = by_date.get(local.date().isoformat())
                  if block is not None:
                      block["schedule"].append({**row, "time": local.strftime("%H:%M"),
                          "occurrenceAtUtc": instant.isoformat().replace("+00:00", "Z")})
          for block in days:
              block["schedule"].sort(key=lambda row: (row["time"], row["title"]))
          output = {"schemaVersion": 3, "source": "subsplease-weekly", "tz": display_zone.key,
              "sourceTimeZone": source_zone.key, "sourceOffsetMinutes": source_offset,
              "timeBasis": "source-offset-at-fetch", "rangeStart": range_start.isoformat(),
              "days": days, "fetchedAtUtc": sys.argv[2]}
          Path("_site/subsplease-schedule.json").write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
