name: Publish site with SubsPlease JSON schedule

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-json-schedule
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage existing site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/_site/' \
            ./ _site/

      - name: Fetch SubsPlease schedule JSON
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --user-agent 'AiringBoard-JsonSchedule/1.0' \
            --output /tmp/subsplease-schedule.json \
            'https://subsplease.org/api/?f=schedule&tz=UTC'

          jq -e '
            (.tz as $tz | (["UTC", "Etc/GMT", "Etc/UTC"] | index($tz)) != null) and
            (.schedule | type == "object") and
            ([.schedule[][]] | length > 0)
          ' /tmp/subsplease-schedule.json > /dev/null

          jq --arg fetchedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '. + {fetchedAtUtc: $fetchedAtUtc}' \
            /tmp/subsplease-schedule.json > _site/subsplease-schedule.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
