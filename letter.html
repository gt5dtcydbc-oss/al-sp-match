<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Text Tracery</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f; color: #fff;
            display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 340px; background: #161616; border-right: 1px solid #252525;
            padding: 20px; overflow-y: auto; flex-shrink: 0; height: 100vh; position: sticky; top: 0;
        }
        .sidebar h1 { font-size: 20px; margin-bottom: 4px; }
        .sidebar .subtitle { font-size: 11px; color: #666; margin-bottom: 24px; }
        .section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid #222; }
        .section:last-of-type { border-bottom: none; }
        .section-header {
            font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: bold;
        }
        .section-header .num {
            background: #333; color: #fff; border-radius: 50%; width: 20px; height: 20px;
            display: inline-flex; align-items: center; justify-content: center; font-size: 10px;
        }
        .drop-zone {
            border: 2px dashed #3a3a3a; border-radius: 8px; padding: 18px 12px;
            text-align: center; color: #888; cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: #a6a6a2; background: #1f1f1f; color: #fff; }
        .drop-zone input[type="file"] { display: none; }
        .drop-zone .hint { font-size: 10px; color: #555; margin-top: 6px; }
        .control-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .control-row label { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; }
        .control-row label .value { color: #fff; font-weight: bold; }
        input[type="text"], select {
            background: #222; color: white; border: 1px solid #333; padding: 8px 10px;
            border-radius: 4px; font-size: 14px; width: 100%; outline: none;
            font-family: monospace; letter-spacing: 2px;
        }
        input[type="text"]:focus, select:focus { border-color: #a6a6a2; }
        input[type="range"] { width: 100%; accent-color: #a6a6a2; }
        .color-swatch-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
            font-size: 14px; font-weight: bold; background: #1c1c1c;
            padding: 6px 10px; border-radius: 4px; border: 1px solid #252525;
        }
        .color-swatch-row input[type="color"] {
            width: 26px; height: 26px; border: none; padding: 0; cursor: pointer;
            background: none; border-radius: 4px;
        }
        .color-swatch-row .hex { font-size: 11px; color: #777; font-family: monospace; margin-left: auto; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #bbb; margin-bottom: 6px; cursor: pointer; }
        .checkbox-row input { cursor: pointer; accent-color: #a6a6a2; }
        button {
            background: #a6a6a2; color: #000; border: none; padding: 10px; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; margin-top: 6px; transition: background 0.2s;
        }
        button:hover { background: #8c8c88; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        button.secondary { background: #222; color: #fff; border: 1px solid #333; }
        button.secondary:hover:not(:disabled) { background: #2a2a2a; }
        button.primary-export { background: #457b9d; color: #fff; }
        button.primary-export:hover:not(:disabled) { background: #356183; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .status-chip {
            display: inline-block; background: #1c1c1c; border: 1px solid #2a2a2a; color: #888;
            font-size: 10px; padding: 3px 8px; border-radius: 12px; margin: 2px; font-family: monospace;
        }
        .status-chip.active { background: #1a2e1a; border-color: #2e4e2e; color: #8eff8e; }
        .status-chip.warn { background: #2e2a1a; border-color: #4e3e2e; color: #ffd700; }
        .status-chip.err { background: #2e1a1a; border-color: #4e2e2e; color: #ff6666; }
        .main { flex: 1; padding: 24px; display: flex; flex-direction: column; min-width: 0; }
        .canvas-wrap {
            background: #fff; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: auto; max-height: calc(100vh - 120px); margin: 0 auto; max-width: 100%; flex: 1;
        }
        canvas { display: block; max-width: 100%; height: auto; }
        .hint-bar {
            background: #161616; border-top: 1px solid #222; padding: 10px 20px;
            font-size: 11px; color: #777; display: flex; justify-content: space-between;
            flex-wrap: wrap; gap: 10px;
        }
        .hint-bar code { color: #ffd700; background: #252525; padding: 1px 5px; border-radius: 3px; font-size: 10px; }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>Text Tracery</h1>
        <div class="subtitle">Animated letter-line overlay generator</div>

        <div class="section">
            <div class="section-header"><span class="num">1</span> Upload Image</div>
            <div class="drop-zone" id="dropZone">
                <div>Click, drag-drop, or paste (Ctrl+V)</div>
                <div class="hint">Supports PNG, JPG, WebP — crop to text for best OCR</div>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
            <div id="ocrStatus" style="margin-top: 8px;"></div>
        </div>

        <div class="section">
            <div class="section-header"><span class="num">2</span> Target Letters</div>
            <input type="text" id="targetLetters" value="XSXZ" placeholder="e.g. XSXZ or A,B,C">
            <div id="colorPickers" style="margin-top: 10px;"></div>
            <div id="positioningStats" style="margin-top: 10px;"></div>
        </div>

        <div class="section">
            <div class="section-header"><span class="num">3</span> Drawing Parameters</div>
            <div class="control-row">
                <label>Connection rule</label>
                <select id="algorithm">
                    <option value="nearest" selected>Nearest-neighbor (sequential)</option>
                    <option value="scanline">Scanline (top→bottom, left→right)</option>
                    <option value="raw">Raw OCR order</option>
                </select>
            </div>
            <div class="control-row">
                <label>Thickness <span class="value" id="thickVal">20px</span></label>
                <input type="range" id="thickness" min="2" max="60" value="20">
            </div>
            <div class="control-row">
                <label>Opacity <span class="value" id="opacVal">0.6</span></label>
                <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.6">
            </div>
            <div class="control-row">
                <label>Roundness <span class="value" id="roundVal">0.8</span></label>
                <input type="range" id="roundness" min="0" max="1" step="0.1" value="0.8">
            </div>
            <div class="control-row">
                <label>Anchor point size <span class="value" id="anchorVal">2px</span></label>
                <input type="range" id="anchorSize" min="1" max="20" value="2">
            </div>
            <label class="checkbox-row"><input type="checkbox" id="showPreciseDots" checked> Show precise anchor points</label>
            <label class="checkbox-row"><input type="checkbox" id="highlightToggle" checked> Glow highlight (letter aura)</label>
            <label class="checkbox-row"><input type="checkbox" id="animateToggle" checked> Animate drawing on update</label>
            <div class="control-row">
                <label>Blend mode</label>
                <select id="blendMode">
                    <option value="multiply" selected>Multiply (ink on light)</option>
                    <option value="screen">Screen (glow on dark)</option>
                    <option value="source-over">Normal (solid)</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-header"><span class="num">4</span> Export</div>
            <div class="btn-group">
                <button id="downloadPngBtn" class="secondary" disabled>Download PNG (display size)</button>
                <button id="downloadHiresBtn" class="primary-export" disabled>Download Hi-Res PNG</button>
                <button id="downloadVideoBtn" class="primary-export" disabled>Record Video (WebM)</button>
                <button id="replayBtn" class="secondary" disabled>Replay Animation</button>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div>
        <div class="hint-bar">
            <div id="canvasDims">No image loaded</div>
            <div><strong>Tip:</strong> Letters layer in input order — first at bottom, last on top.</div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const imageUpload = document.getElementById('imageUpload');
        const targetLettersInput = document.getElementById('targetLetters');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasDims = document.getElementById('canvasDims');
        const ocrStatus = document.getElementById('ocrStatus');
        const positioningStats = document.getElementById('positioningStats');

        const thicknessSlider = document.getElementById('thickness');
        const opacitySlider = document.getElementById('opacity');
        const roundnessSlider = document.getElementById('roundness');
        const anchorSizeSlider = document.getElementById('anchorSize');
        const algorithmSelect = document.getElementById('algorithm');
        const blendModeSelect = document.getElementById('blendMode');
        const highlightToggle = document.getElementById('highlightToggle');
        const animateToggle = document.getElementById('animateToggle');
        const showPreciseDotsToggle = document.getElementById('showPreciseDots');

        const thickVal = document.getElementById('thickVal');
        const opacVal = document.getElementById('opacVal');
        const roundVal = document.getElementById('roundVal');
        const anchorVal = document.getElementById('anchorVal');

        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const downloadHiresBtn = document.getElementById('downloadHiresBtn');
        const downloadVideoBtn = document.getElementById('downloadVideoBtn');
        const replayBtn = document.getElementById('replayBtn');

        let originalImage = new Image();
        let imageLoaded = false;
        let ocrChars = [];          // coords stored in DISPLAY canvas space
        let letterColors = {};
        let pathsToDraw = [];
        let animationFrameId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recalcTimer = null;

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function setStatus(msg, color = '#888', type = '') {
            ocrStatus.innerHTML = `<span class="status-chip ${type}" style="color:${color};border-color:${color}40;">${msg}</span>`;
        }

        function parseTargetLetters(raw) {
            if (raw.includes(',')) return raw.split(',').map(l => l.trim()).filter(l => l.length > 0);
            return raw.split('').filter(c => c.trim().length > 0);
        }

        function generateColorPickers() {
            const letters = parseTargetLetters(targetLettersInput.value);
            const container = document.getElementById('colorPickers');
            container.innerHTML = '';
            const defaultPalette = ['#aa5e82', '#25f459', '#87fd12', '#457b9d', '#e09f3e', '#9e2a2b', '#f4a261', '#e76f51'];
            const seen = {};
            letters.forEach(l => {
                const key = l.toUpperCase();
                if (!seen[key]) seen[key] = defaultPalette[Object.keys(seen).length % defaultPalette.length];
            });
            Object.keys(letterColors).forEach(k => { if (seen[k]) seen[k] = letterColors[k]; });

            const newColors = {};
            Object.keys(seen).forEach(key => {
                const hex = seen[key];
                newColors[key] = hex;
                const row = document.createElement('div');
                row.className = 'color-swatch-row';
                const input = document.createElement('input');
                input.type = 'color';
                input.value = hex;
                const hexSpan = document.createElement('span');
                hexSpan.className = 'hex';
                hexSpan.innerText = hex;
                input.addEventListener('input', (e) => {
                    newColors[key] = e.target.value;
                    letterColors = newColors;
                    hexSpan.innerText = e.target.value;
                    scheduleRecalc(0);
                });
                const label = document.createElement('span');
                label.innerText = key;
                label.style.fontSize = '16px';
                row.appendChild(input); row.appendChild(label); row.appendChild(hexSpan);
                container.appendChild(row);
            });
            letterColors = newColors;
        }

        function sortNearestNeighbor(points) {
            if (points.length < 2) return [...points];
            const unvisited = [...points], sorted = [];
            unvisited.sort((a, b) => a.y - b.y || a.x - b.x);
            let current = unvisited.shift();
            sorted.push(current);
            while (unvisited.length > 0) {
                let nearestIdx = 0, minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    const dist = Math.hypot(current.x - unvisited[i].x, current.y - unvisited[i].y);
                    if (dist < minDist) { minDist = dist; nearestIdx = i; }
                }
                current = unvisited[nearestIdx];
                sorted.push(current);
                unvisited.splice(nearestIdx, 1);
            }
            return sorted;
        }
        function sortScanline(points) { return [...points].sort((a, b) => a.y - b.y || a.x - b.x); }

        function generateSmoothPoints(points, roundness) {
            const result = [];
            if (points.length < 2) return points;
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i], p2 = points[i + 1];
                const p3 = i !== points.length - 2 ? points[i + 2] : p2;
                const cp1x = p1.x + (p2.x - p0.x) / 6 * roundness, cp1y = p1.y + (p2.y - p0.y) / 6 * roundness;
                const cp2x = p2.x - (p3.x - p1.x) / 6 * roundness, cp2y = p2.y - (p3.y - p1.y) / 6 * roundness;
                for (let t = 0; t <= 1; t += 1 / 40) {
                    const mt = 1 - t;
                    result.push({
                        x: mt*mt*mt*p1.x + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*p2.x,
                        y: mt*mt*mt*p1.y + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*p2.y
                    });
                }
            }
            result.push(points[points.length - 1]);
            return result;
        }

        // ---- THE update path: single entry point, error-proof ----
        function scheduleRecalc(delay = 100) {
            clearTimeout(recalcTimer);
            recalcTimer = setTimeout(recalcPaths, delay);
        }

        function recalcPaths() {
            if (!imageLoaded) return;
            try {
                const letters = parseTargetLetters(targetLettersInput.value);
                const uniqueLetters = [];
                letters.forEach(l => {
                    const key = l.toUpperCase();
                    if (!uniqueLetters.includes(key)) uniqueLetters.push(key);
                });

                const roundness = parseFloat(roundnessSlider.value);
                const algo = algorithmSelect.value;

                pathsToDraw = [];
                let statsHtml = '';
                let totalFound = 0, totalPts = 0;

                uniqueLetters.forEach(key => {
                    const color = letterColors[key] || '#ffffff';
                    const matches = ocrChars.filter(c => c.char.toUpperCase() === key);
                    totalFound += matches.length;
                    statsHtml += `<span class="status-chip active">${key}: ${matches.length}</span>`;
                    if (matches.length > 0) {
                        let sorted;
                        if (algo === 'nearest') sorted = sortNearestNeighbor(matches);
                        else if (algo === 'scanline') sorted = sortScanline(matches);
                        else sorted = matches;
                        const pathPoints = roundness > 0 ? generateSmoothPoints(sorted, roundness) : sorted;
                        totalPts += pathPoints.length;
                        pathsToDraw.push({ dots: sorted, pathPoints, color, letter: key });
                    }
                });

                statsHtml += `<span class="status-chip">paths: ${pathsToDraw.length} · pts: ${totalPts} · algo: ${algo}</span>`;
                positioningStats.innerHTML = statsHtml || '<span style="color:#666;font-size:11px;">No matches</span>';

                if (animateToggle.checked) startAnimation();
                else drawFrame(1);
            } catch (err) {
                console.error(err);
                setStatus('Update error: ' + err.message, '#ff6666', 'err');
            }
        }

        function drawFrame(progress, targetCtx = ctx, targetCanvas = canvas, scale = 1) {
            if (!imageLoaded) return;
            targetCtx.save();
            targetCtx.globalCompositeOperation = 'source-over';
            targetCtx.globalAlpha = 1.0;
            targetCtx.drawImage(originalImage, 0, 0, targetCanvas.width, targetCanvas.height);

            const mode = blendModeSelect.value;
            targetCtx.globalCompositeOperation = mode;
            targetCtx.lineJoin = 'round';
            targetCtx.lineCap = 'round';

            const thickness = parseInt(thicknessSlider.value) * scale;
            const opacity = parseFloat(opacitySlider.value);
            const doHighlight = highlightToggle.checked;
            const showPrecise = showPreciseDotsToggle.checked;
            const anchorSize = parseInt(anchorSizeSlider.value) * scale;

            pathsToDraw.forEach(pathData => {
                const { dots, pathPoints, color } = pathData;
                const highlightOpacity = (mode === 'multiply') ? opacity * 0.5 : opacity * 0.8;
                const highlightColor = hexToRgba(color, highlightOpacity);

                if (doHighlight) {
                    targetCtx.fillStyle = highlightColor;
                    targetCtx.shadowColor = highlightColor;
                    targetCtx.shadowBlur = thickness * 0.3;
                    for (const p of dots) {
                        targetCtx.beginPath();
                        targetCtx.arc(p.x * scale, p.y * scale, Math.max(thickness * 0.8, 4), 0, Math.PI * 2);
                        targetCtx.fill();
                    }
                    targetCtx.shadowBlur = 0;
                }

                if (pathPoints.length > 1) {
                    const totalPoints = pathPoints.length;
                    const currentPointIndex = Math.floor(progress * totalPoints);
                    targetCtx.strokeStyle = hexToRgba(color, opacity);
                    targetCtx.lineWidth = thickness;
                    targetCtx.beginPath();
                    targetCtx.moveTo(pathPoints[0].x * scale, pathPoints[0].y * scale);
                    for (let i = 1; i <= currentPointIndex && i < totalPoints; i++) {
                        targetCtx.lineTo(pathPoints[i].x * scale, pathPoints[i].y * scale);
                    }
                    targetCtx.stroke();
                }
            });

            if (showPrecise && pathsToDraw.length > 0) {
                targetCtx.globalCompositeOperation = 'source-over';
                targetCtx.globalAlpha = 0.95;
                pathsToDraw.forEach(pathData => {
                    targetCtx.fillStyle = hexToRgba(pathData.color, 1);
                    for (const p of pathData.dots) {
                        targetCtx.beginPath();
                        targetCtx.arc(p.x * scale, p.y * scale, anchorSize, 0, Math.PI * 2);
                        targetCtx.fill();
                    }
                });
            }
            targetCtx.restore();
        }

        function startAnimation(onComplete) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            const duration = 2200;
            let startTime = null;
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const linear = Math.min((timestamp - startTime) / duration, 1);
                drawFrame(linear * (2 - linear));
                if (linear < 1) animationFrameId = requestAnimationFrame(animate);
                else if (onComplete) onComplete();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        function loadImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImage.onload = () => {
                    const MAX = 1200;
                    let w = originalImage.naturalWidth, h = originalImage.naturalHeight;
                    if (w > MAX || h > MAX) {
                        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                        else { w = Math.round(w * MAX / h); h = MAX; }
                    }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(originalImage, 0, 0, w, h);
                    imageLoaded = true;
                    pathsToDraw = []; ocrChars = [];
                    canvasDims.innerHTML = `<code>${originalImage.naturalWidth} × ${originalImage.naturalHeight}</code> (display: ${w} × ${h})`;
                    setStatus('Running OCR...', '#ffd700', 'warn');
                    runOCR().then(() => {
                        generateColorPickers();
                        recalcPaths();
                        setExportButtons(true);
                    });
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function runOCR() {
            ocrChars = [];
            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(originalImage);
                await worker.terminate();

                // *** FIX: map full-res OCR coords into DISPLAY canvas space ***
                const sx = canvas.width / originalImage.naturalWidth;
                const sy = canvas.height / originalImage.naturalHeight;

                if (ret.data.words) {
                    for (const word of ret.data.words) {
                        if (word.symbols) {
                            for (const symbol of word.symbols) {
                                if (symbol.text && symbol.text.trim().length > 0) {
                                    ocrChars.push({
                                        char: symbol.text,
                                        x: (symbol.bbox.x0 + symbol.bbox.x1) / 2 * sx,
                                        y: (symbol.bbox.y0 + symbol.bbox.y1) / 2 * sy
                                    });
                                }
                            }
                        }
                    }
                }
                setStatus(`OCR complete: ${ocrChars.length} characters extracted`, '#8eff8e', 'active');
            } catch (e) {
                console.error(e);
                setStatus('OCR failed — see console', '#ff6666', 'err');
            }
        }

        // ---- Event wiring: every control listens to BOTH input & change ----
        imageUpload.addEventListener('change', (e) => loadImage(e.target.files[0]));
        dropZone.addEventListener('click', () => imageUpload.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0]);
        });
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) { e.preventDefault(); loadImage(items[i].getAsFile()); return; }
            }
        });

        targetLettersInput.addEventListener('input', () => {
            clearTimeout(recalcTimer);
            recalcTimer = setTimeout(() => { generateColorPickers(); recalcPaths(); }, 120);
        });

        const needsRecalc = new Set([roundnessSlider, algorithmSelect]);
        [thicknessSlider, opacitySlider, roundnessSlider, anchorSizeSlider,
         algorithmSelect, blendModeSelect, highlightToggle, animateToggle, showPreciseDotsToggle]
        .forEach(el => {
            const handler = () => {
                thickVal.textContent = thicknessSlider.value + 'px';
                opacVal.textContent = opacitySlider.value;
                roundVal.textContent = roundnessSlider.value;
                anchorVal.textContent = anchorSizeSlider.value + 'px';
                if (needsRecalc.has(el)) scheduleRecalc(100);
                else drawFrame(1);
            };
            el.addEventListener('input', handler);
            el.addEventListener('change', handler);
        });

        function setExportButtons(on) {
            [downloadPngBtn, downloadHiresBtn, replayBtn, downloadVideoBtn].forEach(b => b.disabled = !on);
        }

        downloadPngBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'tracery-display.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        downloadHiresBtn.addEventListener('click', () => {
            if (!imageLoaded) return;
            const hiresCanvas = document.createElement('canvas');
            hiresCanvas.width = originalImage.naturalWidth;
            hiresCanvas.height = originalImage.naturalHeight;
            const scale = originalImage.naturalWidth / canvas.width;
            drawFrame(1, hiresCanvas.getContext('2d'), hiresCanvas, scale);
            const link = document.createElement('a');
            link.download = 'tracery-hires.png';
            link.href = hiresCanvas.toDataURL('image/png');
            link.click();
        });

        downloadVideoBtn.addEventListener('click', () => {
            if (pathsToDraw.length === 0) return;
            setStatus('Recording video...', '#ffd700', 'warn');
            downloadVideoBtn.disabled = true; replayBtn.disabled = true;
            recordedChunks = [];
            const stream = canvas.captureStream(60);
            const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                ? { mimeType: 'video/webm;codecs=vp9' } : { mimeType: 'video/webm' };
            mediaRecorder = new MediaRecorder(stream, options);
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'tracery-animation.webm'; a.click();
                URL.revokeObjectURL(url);
                setStatus('Video downloaded!', '#8eff8e', 'active');
                downloadVideoBtn.disabled = false; replayBtn.disabled = false;
            };
            mediaRecorder.start();
            startAnimation(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
        });

        replayBtn.addEventListener('click', () => { if (pathsToDraw.length > 0) startAnimation(); });

        generateColorPickers();
    </script>
</body>
</html>
