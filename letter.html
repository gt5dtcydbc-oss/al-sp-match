<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felt-Tip OCR Letter Connector</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 1000px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
        }
        label {
            font-size: 12px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="file"] {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #a6a6a2;
        }
        button {
            background: #a6a6a2;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 24px;
        }
        button:hover { background: #8c8c88; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        #status {
            font-size: 13px;
            color: #ffd700;
            margin-top: 10px;
            height: 15px;
        }
        .canvas-container {
            position: relative;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            overflow: auto;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="%23222"/><rect x="10" y="10" width="10" height="10" fill="%23222"/></svg>');
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .color-pickers {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="color"] {
            background: none;
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            padding: 0;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
        .toggle-group input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>1. Upload Image</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        <div class="control-group">
            <label>2. Target Letters</label>
            <input type="text" id="targetLetters" value="N, A, W" placeholder="e.g. A, B, C">
        </div>
        <div class="control-group">
            <label>3. Colors</label>
            <div id="colorPickers" class="color-pickers"></div>
        </div>
        
        <div class="control-group">
            <label>Thickness: <span id="thickVal">20</span>px</label>
            <input type="range" id="thickness" min="2" max="60" value="20">
            
            <label>Opacity: <span id="opacVal">0.6</span></label>
            <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.6">
            
            <label>Roundness: <span id="roundVal">0.8</span></label>
            <input type="range" id="roundness" min="0" max="1" step="0.1" value="0.8">
        </div>

        <div class="control-group" style="justify-content: flex-end;">
            <button id="processBtn">Process Image</button>
            <span id="status"></span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const processBtn = document.getElementById('processBtn');
        const targetLettersInput = document.getElementById('targetLetters');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        
        const thicknessSlider = document.getElementById('thickness');
        const opacitySlider = document.getElementById('opacity');
        const roundnessSlider = document.getElementById('roundness');
        
        const thickVal = document.getElementById('thickVal');
        const opacVal = document.getElementById('opacVal');
        const roundVal = document.getElementById('roundVal');

        let uploadedImage = new Image();
        let currentImageLoaded = false;
        let letterColors = {};

        thicknessSlider.addEventListener('input', (e) => thickVal.innerText = e.target.value);
        opacitySlider.addEventListener('input', (e) => opacVal.innerText = e.target.value);
        roundnessSlider.addEventListener('input', (e) => roundVal.innerText = e.target.value);

        function generateColorPickers() {
            const raw = targetLettersInput.value;
            const letters = raw.split(',').map(l => l.trim().toUpperCase()).filter(l => l.length > 0);
            const container = document.getElementById('colorPickers');
            container.innerHTML = '';
            
            const defaultPalette = ['#9d8189', '#6b705c', '#b56576', '#457b9d', '#e09f3e', '#9e2a2b'];
            
            letters.forEach((letter, index) => {
                if (!letterColors[letter]) {
                    letterColors[letter] = defaultPalette[index % defaultPalette.length];
                }
                
                const row = document.createElement('div');
                row.className = 'color-row';
                
                const label = document.createElement('span');
                label.innerText = letter;
                
                const input = document.createElement('input');
                input.type = 'color';
                input.value = letterColors[letter];
                input.addEventListener('input', (e) => {
                    letterColors[letter] = e.target.value;
                });
                
                row.appendChild(label);
                row.appendChild(input);
                container.appendChild(row);
            });

            const toggleGroup = document.createElement('label');
            toggleGroup.className = 'toggle-group';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'highlightToggle';
            checkbox.checked = true;
            
            const toggleLabel = document.createElement('span');
            toggleLabel.innerText = 'Highlight Letters';
            toggleLabel.style.fontSize = '12px';
            toggleLabel.style.color = '#aaa';
            
            toggleGroup.appendChild(checkbox);
            toggleGroup.appendChild(toggleLabel);
            container.appendChild(toggleGroup);
        }
        
        targetLettersInput.addEventListener('input', generateColorPickers);
        generateColorPickers();

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedImage.onload = () => {
                    canvas.width = uploadedImage.width;
                    canvas.height = uploadedImage.height;
                    ctx.drawImage(uploadedImage, 0, 0);
                    currentImageLoaded = true;
                    statusText.innerText = "Image loaded. Ready to process.";
                    statusText.style.color = "#00ff00";
                };
                uploadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function sortNearestNeighbor(points) {
            if (points.length < 2) return points;
            let unvisited = [...points];
            let sorted = [];
            
            unvisited.sort((a, b) => a.y - b.y || a.x - b.x);
            let current = unvisited.shift();
            sorted.push(current);

            while (unvisited.length > 0) {
                let nearestIdx = 0;
                let minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    let dist = Math.hypot(current.x - unvisited[i].x, current.y - unvisited[i].y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }
                current = unvisited[nearestIdx];
                sorted.push(current);
                unvisited.splice(nearestIdx, 1);
            }
            return sorted;
        }

        function drawPath(roundness) {
            ctx.beginPath();
            // FIX: We must explicitly move to the first point before drawing curves!
            ctx.moveTo(window.currentPoints[0].x, window.currentPoints[0].y);

            for (let i = 0; i < window.currentPoints.length - 1; i++) {
                const p0 = i > 0 ? window.currentPoints[i - 1] : window.currentPoints[0];
                const p1 = window.currentPoints[i];
                const p2 = window.currentPoints[i + 1];
                const p3 = i != window.currentPoints.length - 2 ? window.currentPoints[i + 2] : p2;

                const cp1x = p1.x + (p2.x - p0.x) / 6 * roundness;
                const cp1y = p1.y + (p2.y - p0.y) / 6 * roundness;

                const cp2x = p2.x - (p3.x - p1.x) / 6 * roundness;
                const cp2y = p2.y - (p3.y - p1.y) / 6 * roundness;

                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
            }
            ctx.stroke();
        }

        processBtn.addEventListener('click', async () => {
            if (!currentImageLoaded) {
                alert("Please upload an image first!");
                return;
            }

            const targets = Object.keys(letterColors);
            if (targets.length === 0) {
                alert("Please enter at least one letter!");
                return;
            }

            const thickness = parseInt(thicknessSlider.value);
            const opacity = parseFloat(opacitySlider.value);
            const roundness = parseFloat(roundnessSlider.value);
            const doHighlight = document.getElementById('highlightToggle').checked;

            processBtn.disabled = true;
            statusText.innerText = "Scanning image... (Please wait)";
            statusText.style.color = "#ffd700";

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(uploadedImage);
                await worker.terminate();

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                ctx.drawImage(uploadedImage, 0, 0);

                const words = ret.data.words;
                let totalFound = 0;

                // Set global blend mode for the "ink" effect
                ctx.globalCompositeOperation = 'multiply';
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                for (const targetChar of targets) {
                    let points = [];

                    for (const word of words) {
                        if (word.symbols) {
                            for (const symbol of word.symbols) {
                                if (symbol.text.toUpperCase() === targetChar) {
                                    points.push({
                                        x: (symbol.bbox.x0 + symbol.bbox.x1) / 2,
                                        y: (symbol.bbox.y0 + symbol.bbox.y1) / 2
                                    });
                                }
                            }
                        }
                    }

                    totalFound += points.length;

                    if (points.length > 0) {
                        const sortedPoints = sortNearestNeighbor(points);
                        window.currentPoints = sortedPoints; 
                        
                        const color = letterColors[targetChar];

                        // --- 1. DRAW FELT-TIP HIGHLIGHT DABS ---
                        if (doHighlight) {
                            ctx.globalAlpha = opacity;
                            ctx.fillStyle = color;
                            
                            // Add a slight blur to the highlight so it looks like a marker dab
                            ctx.shadowColor = color;
                            ctx.shadowBlur = thickness * 0.2; 

                            for (const p of sortedPoints) {
                                ctx.beginPath();
                                // Make the circle scale with the thickness, with a minimum size
                                const radius = Math.max(thickness * 0.7, 6); 
                                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            // Turn off shadow so it doesn't affect the line
                            ctx.shadowBlur = 0;
                        }

                        // --- 2. DRAW CONNECTING LINE ---
                        ctx.strokeStyle = color;
                        ctx.globalAlpha = opacity;

                        // Main Body
                        ctx.lineWidth = thickness;
                        drawPath(roundness);
                        
                    }
                }
                
                ctx.globalCompositeOperation = 'source-over';
                ctx.shadowBlur = 0;

                if (totalFound === 0) {
                    statusText.innerText = "Finished, but found 0 instances.";
                    statusText.style.color = "#ff4444";
                } else {
                    statusText.innerText = `Done! Connected ${totalFound} letters.`;
                    statusText.style.color = "#00ff00";
                }

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error during OCR. See console.";
                statusText.style.color = "#ff4444";
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
