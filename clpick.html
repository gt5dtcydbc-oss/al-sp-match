<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Color Constellation</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
            --accent: #a6a6a2;
            --accent-hover: #c0c0bc;
            --border: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Layout --- */
        .sidebar {
            width: 360px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="%23181818"/><rect x="10" y="10" width="10" height="10" fill="%23181818"/></svg>');
            overflow: auto;
            position: relative;
        }

        /* --- UI Elements --- */
        h1 { font-size: 18px; margin: 0 0 10px 0; color: #fff; }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }

        input[type="text"], input[type="file"], select {
            background: #2a2a2a;
            color: white;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 5px; }
        
        /* --- Dynamic Color Rows --- */
        #colorList {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .color-swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        input[type="color"] {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 0;
        }

        .arrow {
            color: #555;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-picker {
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            padding: 0 10px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: auto;
            transition: background 0.2s;
        }
        .btn-picker:hover { background: #444; }
        .btn-picker.active { background: #457b9d; color: #fff; border-color: #457b9d; }

        .btn-remove {
            background: #331111;
            color: #ff5555;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-remove:hover { background: #441111; }

        .btn-add {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-add:hover { background: #333; }

        button.process-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-size: 14px;
            margin-top: 10px;
        }
        button.process-btn:hover { background: var(--accent-hover); }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }

        .download-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #downloadBtn, #svgBtn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        #downloadBtn:hover, #svgBtn:hover { background: #333; }

        .hidden { display: none !important; }

        .status { font-size: 12px; color: #ffd700; text-align: center; min-height: 15px; margin-top: 10px;}

        /* --- Canvas Output --- */
        canvas, #resultImage {
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #fff;
        }
        
        #resultImage {
            object-fit: contain;
            -webkit-touch-callout: default;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            margin-top: 5px;
        }
        .toggle-group input { width: 16px; height: 16px; cursor: pointer; }

        /* Eyedropper cursor */
        .picking-color { cursor: crosshair !important; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h1>Color Constellation</h1>
        
        <div class="control-group">
            <div class="section-title">1. Base Image</div>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <div class="control-group">
            <div class="section-title">2. Target Colors</div>
            <div id="colorList"></div>
            <button id="addColorBtn" class="btn-add">+ Add Color Layer</button>
        </div>

        <div class="control-group">
            <div class="section-title">3. Detection Settings</div>
            <label>Tolerance: <span id="tolVal">40</span></label>
            <input type="range" id="tolerance" min="5" max="150" value="40">
            <label style="font-size: 10px; color: #666; margin-top: 2px;">*Higher captures more shades of the color.</label>
            
            <label>Min Blob Size: <span id="sizeVal">50</span>px</label>
            <input type="range" id="minSize" min="10" max="500" value="50">
            <label style="font-size: 10px; color: #666; margin-top: 2px;">*Filters out tiny specks of color.</label>
        </div>

        <div class="control-group">
            <div class="section-title">4. Drawing Settings</div>
            <label>Line Thickness: <span id="lineThickVal">20</span>px</label>
            <input type="range" id="lineThickness" min="2" max="50" value="20">
            
            <label>Line Opacity: <span id="lineOpacVal">0.6</span></label>
            <input type="range" id="lineOpacity" min="0.1" max="1" step="0.05" value="0.6">

            <label>Line Roundness: <span id="lineRoundVal">0.8</span></label>
            <input type="range" id="lineRoundness" min="0" max="1" step="0.1" value="0.8">
            
            <label>Blend Mode</label>
            <select id="blendMode">
                <option value="multiply" selected>Multiply (Ink - Light Images)</option>
                <option value="screen">Screen (Glow - Dark Images)</option>
                <option value="source-over">Normal (Solid - Any Image)</option>
            </select>
        </div>

        <div class="control-group">
            <label class="toggle-group">
                <input type="checkbox" id="highlightToggle" checked> Highlight Centers
            </label>
            <label class="toggle-group">
                <input type="checkbox" id="animateToggle" checked> Animate Drawing
            </label>
        </div>

        <!-- ACTIONS -->
        <div class="control-group" style="margin-top: auto; padding-top: 20px;">
            <button id="processBtn" class="process-btn">Process Image</button>
            
            <div class="download-group hidden" id="downloadGroup">
                <button id="downloadBtn">PNG</button>
                <button id="svgBtn">SVG</button>
            </div>
            <button id="replayBtn" class="hidden" style="background:#457b9d; color:#fff; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:10px;">Replay Animation</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <!-- MAIN OUTPUT -->
    <div class="main-content">
        <div class="output-container">
            <canvas id="canvas"></canvas>
            <img id="resultImage" class="hidden" alt="Color Tracery">
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultImage = document.getElementById('resultImage');
        const processBtn = document.getElementById('processBtn');
        const replayBtn = document.getElementById('replayBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const svgBtn = document.getElementById('svgBtn');
        const downloadGroup = document.getElementById('downloadGroup');
        const statusText = document.getElementById('status');
        
        // Inputs
        const imageUpload = document.getElementById('imageUpload');
        const colorListDiv = document.getElementById('colorList');
        const addColorBtn = document.getElementById('addColorBtn');
        
        const toleranceSlider = document.getElementById('tolerance');
        const minSizeSlider = document.getElementById('minSize');
        
        const lineThickness = document.getElementById('lineThickness');
        const lineOpacity = document.getElementById('lineOpacity');
        const lineRoundness = document.getElementById('lineRoundness');
        const blendModeSelect = document.getElementById('blendMode');
        
        const highlightToggle = document.getElementById('highlightToggle');
        const animateToggle = document.getElementById('animateToggle');

        // --- State ---
        let uploadedImage = new Image();
        let currentImageLoaded = false;
        
        // Dynamic Colors: Array of objects { targetHex, lineHex }
        let activeColors = [
            { targetHex: '#ff0000', lineHex: '#ff0000' }
        ];
        
        let activeEyedropperIndex = -1; // Tracks which color row is currently picking
        
        let animationFrameId = null;
        let pathsToDraw = []; 
        let lastSvgString = '';

        // --- UI Sync ---
        toleranceSlider.addEventListener('input', (e) => document.getElementById('tolVal').innerText = e.target.value);
        minSizeSlider.addEventListener('input', (e) => document.getElementById('sizeVal').innerText = e.target.value);
        lineThickness.addEventListener('input', (e) => document.getElementById('lineThickVal').innerText = e.target.value);
        lineOpacity.addEventListener('input', (e) => document.getElementById('lineOpacVal').innerText = e.target.value);
        lineRoundness.addEventListener('input', (e) => document.getElementById('lineRoundVal').innerText = e.target.value);

        // Live Preview redraw if sliders change
        function updatePreview() {
            if (pathsToDraw.length > 0 && !animateToggle.checked) {
                drawFrame(1);
            }
        }
        lineThickness.addEventListener('input', updatePreview);
        lineOpacity.addEventListener('input', updatePreview);
        lineRoundness.addEventListener('input', updatePreview);
        blendModeSelect.addEventListener('change', updatePreview);
        highlightToggle.addEventListener('change', updatePreview);

        // --- Dynamic Color List UI ---
        function renderColorList() {
            colorListDiv.innerHTML = '';
            
            activeColors.forEach((colorObj, index) => {
                const row = document.createElement('div');
                row.className = 'color-row';
                
                // 1. Target Color Swatch
                const targetWrap = document.createElement('div');
                targetWrap.className = 'color-swatch';
                const targetInput = document.createElement('input');
                targetInput.type = 'color';
                targetInput.value = colorObj.targetHex;
                targetInput.addEventListener('input', (e) => {
                    activeColors[index].targetHex = e.target.value;
                    // If the line color matched the old target color, update it too
                    if (activeColors[index].lineHex === colorObj.targetHex) {
                        activeColors[index].lineHex = e.target.value;
                        renderColorList(); // Re-render to update the line picker UI
                    }
                });
                targetWrap.appendChild(targetInput);
                targetWrap.appendChild(Object.assign(document.createElement('span'), {innerText: 'Find'}));
                
                // 2. Arrow
                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.innerText = '→';
                
                // 3. Line Color Swatch
                const lineWrap = document.createElement('div');
                lineWrap.className = 'color-swatch';
                const lineInput = document.createElement('input');
                lineInput.type = 'color';
                lineInput.value = colorObj.lineHex;
                lineInput.addEventListener('input', (e) => {
                    activeColors[index].lineHex = e.target.value;
                });
                lineWrap.appendChild(lineInput);
                lineWrap.appendChild(Object.assign(document.createElement('span'), {innerText: 'Draw'}));

                // 4. Eyedropper Button
                const pickBtn = document.createElement('button');
                pickBtn.className = 'btn-picker';
                pickBtn.innerText = 'Pick';
                if (activeEyedropperIndex === index) pickBtn.classList.add('active');
                
                pickBtn.onclick = () => {
                    if (!currentImageLoaded) return alert("Upload an image first.");
                    
                    if (activeEyedropperIndex === index) {
                        // Toggle off
                        activeEyedropperIndex = -1;
                        canvas.classList.remove('picking-color');
                    } else {
                        // Toggle on
                        activeEyedropperIndex = index;
                        canvas.classList.add('picking-color');
                    }
                    renderColorList(); // Update button states
                };
                
                // 5. Remove Button
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.innerText = '✕';
                removeBtn.onclick = () => {
                    if (activeColors.length > 1) {
                        activeColors.splice(index, 1);
                        if (activeEyedropperIndex === index) activeEyedropperIndex = -1;
                        else if (activeEyedropperIndex > index) activeEyedropperIndex--;
                        renderColorList();
                    }
                };

                row.appendChild(targetWrap);
                row.appendChild(arrow);
                row.appendChild(lineWrap);
                row.appendChild(pickBtn);
                row.appendChild(removeBtn);
                colorListDiv.appendChild(row);
            });
        }

        addColorBtn.onclick = () => {
            // Pick a random bright color for the new layer
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            activeColors.push({ targetHex: randomColor, lineHex: randomColor });
            renderColorList();
        };

        renderColorList();

        // --- Eyedropper Canvas Interaction ---
        canvas.addEventListener('click', (e) => {
            if (activeEyedropperIndex === -1 || !currentImageLoaded) return;
            
            // Get click coordinates relative to canvas
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            // Sample the pixel
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            
            // If pixel is perfectly transparent, don't pick it
            if (pixel[3] === 0) return;

            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            
            // Update the active row
            const oldHex = activeColors[activeEyedropperIndex].targetHex;
            activeColors[activeEyedropperIndex].targetHex = hex;
            
            // Also update the draw color if they were previously synced
            if (activeColors[activeEyedropperIndex].lineHex === oldHex) {
                 activeColors[activeEyedropperIndex].lineHex = hex;
            }
            
            // Turn off eyedropper
            activeEyedropperIndex = -1;
            canvas.classList.remove('picking-color');
            renderColorList();
        });


        // --- Image Upload ---
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedImage.onload = () => {
                    canvas.classList.remove('hidden');
                    resultImage.classList.add('hidden');
                    downloadGroup.classList.add('hidden');
                    replayBtn.classList.add('hidden');

                    // Scale down massive images for performance
                    const MAX_SIZE = 1400;
                    let w = uploadedImage.width;
                    let h = uploadedImage.height;
                    if (w > MAX_SIZE || h > MAX_SIZE) {
                        if (w > h) { h = Math.round(h * (MAX_SIZE / w)); w = MAX_SIZE; }
                        else { w = Math.round(w * (MAX_SIZE / h)); h = MAX_SIZE; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(uploadedImage, 0, 0, w, h);
                    
                    currentImageLoaded = true;
                    statusText.innerText = "Image loaded. Ready to process.";
                    statusText.style.color = "#00ff00";
                    pathsToDraw = [];
                };
                uploadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- Algorithms ---
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
        }

        function colorDistance(r1, g1, b1, r2, g2, b2) {
            return Math.sqrt(Math.pow(r1 - r2, 2) + Math.pow(g1 - g2, 2) + Math.pow(b1 - b2, 2));
        }

        function floodFill(startX, startY, targetRgb, tolerance, data, width, height, visited) {
            const queue = [[startX, startY]];
            const blob = { minX: startX, maxX: startX, minY: startY, maxY: startY, pixelCount: 0 };
            visited[startY * width + startX] = 1;

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                blob.pixelCount++;
                if (x < blob.minX) blob.minX = x;
                if (x > blob.maxX) blob.maxX = x;
                if (y < blob.minY) blob.minY = y;
                if (y > blob.maxY) blob.maxY = y;

                const neighbors = [[x + 2, y], [x - 2, y], [x, y + 2], [x, y - 2]];
                for (const [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        const nVisitedIdx = ny * width + nx;
                        if (!visited[nVisitedIdx]) {
                            const idx = (ny * width + nx) * 4;
                            if (colorDistance(data[idx], data[idx+1], data[idx+2], targetRgb.r, targetRgb.g, targetRgb.b) <= tolerance) {
                                visited[nVisitedIdx] = 1;
                                queue.push([nx, ny]);
                            }
                        }
                    }
                }
            }
            return blob;
        }

        function sortNearestNeighbor(points) {
            if (points.length < 2) return points;
            let unvisited = [...points];
            let sorted = [];
            unvisited.sort((a, b) => a.y - b.y || a.x - b.x);
            let current = unvisited.shift();
            sorted.push(current);

            while (unvisited.length > 0) {
                let nearestIdx = 0;
                let minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    let dist = Math.hypot(current.x - unvisited[i].x, current.y - unvisited[i].y);
                    if (dist < minDist) { minDist = dist; nearestIdx = i; }
                }
                current = unvisited[nearestIdx];
                sorted.push(current);
                unvisited.splice(nearestIdx, 1);
            }
            return sorted;
        }

        function generateSmoothPoints(points, roundness) {
            let result = [];
            if (points.length < 2) return points;
            
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i != points.length - 2 ? points[i + 2] : p2;

                const cp1x = p1.x + (p2.x - p0.x) / 6 * roundness;
                const cp1y = p1.y + (p2.y - p0.y) / 6 * roundness;
                const cp2x = p2.x - (p3.x - p1.x) / 6 * roundness;
                const cp2y = p2.y - (p3.y - p1.y) / 6 * roundness;

                const steps = 40; 
                for (let t = 0; t <= 1; t += 1/steps) {
                    const mt = 1 - t;
                    const x = mt*mt*mt*p1.x + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*p2.x;
                    const y = mt*mt*mt*p1.y + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*p2.y;
                    result.push({x, y});
                }
            }
            result.push(points[points.length - 1]); 
            return result;
        }

        function getBezierPathData(points, roundness) {
            if (points.length < 2) return "";
            let d = `M ${points[0].x} ${points[0].y} `;
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i != points.length - 2 ? points[i + 2] : p2;

                const cp1x = p1.x + (p2.x - p0.x) / 6 * roundness;
                const cp1y = p1.y + (p2.y - p0.y) / 6 * roundness;
                const cp2x = p2.x - (p3.x - p1.x) / 6 * roundness;
                const cp2y = p2.y - (p3.y - p1.y) / 6 * roundness;

                d += `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y} `;
            }
            return d;
        }

        // --- Drawing Logic ---
        function drawFrame(progress) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);

            if (pathsToDraw.length === 0) return;

            const mode = blendModeSelect.value;
            ctx.globalCompositeOperation = mode;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";

            const thickness = parseInt(lineThickness.value);
            const opacity = parseFloat(lineOpacity.value);
            const doHighlight = highlightToggle.checked;

            const highlightOpacity = (mode === 'multiply') ? opacity * 0.5 : opacity * 0.8;

            // Iterate over all colored path groups
            pathsToDraw.forEach(pathGroup => {
                const { dots, pathPoints, color } = pathGroup;
                
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                
                const highlightRgba = `rgba(${r}, ${g}, ${b}, ${highlightOpacity})`;
                const lineRgba = `rgba(${r}, ${g}, ${b}, ${opacity})`;

                if (doHighlight) {
                    ctx.fillStyle = highlightRgba;
                    ctx.shadowColor = highlightRgba;
                    ctx.shadowBlur = thickness * 0.2; 
                    for (const p of dots) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, Math.max(thickness * 0.7, 6), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                if (pathPoints.length > 1) {
                    const totalPoints = pathPoints.length;
                    const currentPointIndex = Math.floor(progress * totalPoints);
                    
                    ctx.strokeStyle = lineRgba;
                    ctx.lineWidth = thickness;
                    
                    ctx.beginPath();
                    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                    
                    for(let i = 1; i <= currentPointIndex && i < totalPoints; i++) {
                        ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                    }
                    ctx.stroke();
                }
            });
            
            ctx.globalCompositeOperation = 'source-over';
        }

        // --- Animation Loop ---
        function startAnimation(onComplete) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            const duration = 2000; 
            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                
                let linearProgress = Math.min(elapsed / duration, 1);
                let easedProgress = linearProgress * (2 - linearProgress); 

                drawFrame(easedProgress);

                if (linearProgress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else if (onComplete) {
                    onComplete();
                }
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        // --- Main Processing ---
        processBtn.addEventListener('click', () => {
            if (!currentImageLoaded) return alert("Please upload an image first!");
            
            processBtn.disabled = true;
            statusText.innerText = "Scanning for colors... (Please wait)";
            statusText.style.color = "#ffd700";
            
            canvas.classList.remove('hidden');
            resultImage.classList.add('hidden');
            downloadGroup.classList.add('hidden');
            replayBtn.classList.add('hidden');
            lastSvgString = '';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            setTimeout(() => {
                try {
                    const tolerance = parseInt(toleranceSlider.value);
                    const minSize = parseInt(minSizeSlider.value);
                    const roundness = parseFloat(lineRoundness.value);

                    ctx.globalCompositeOperation = 'source-over';
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    const width = canvas.width;
                    const height = canvas.height;
                    
                    const visited = new Uint8Array(width * height);
                    
                    pathsToDraw = [];
                    let totalBlobsFound = 0;
                    let svgElements = '';

                    // Loop through all active colors!
                    activeColors.forEach(colorObj => {
                        const targetRgb = hexToRgb(colorObj.targetHex);
                        const drawHex = colorObj.lineHex;
                        const blobs = [];

                        for (let y = 0; y < height; y+=2) { 
                            for (let x = 0; x < width; x+=2) {
                                const idx = (y * width + x) * 4;
                                if (visited[y * width + x] || data[idx+3] < 50) continue;
                                
                                if (colorDistance(data[idx], data[idx+1], data[idx+2], targetRgb.r, targetRgb.g, targetRgb.b) <= tolerance) {
                                    const blob = floodFill(x, y, targetRgb, tolerance, data, width, height, visited);
                                    if (blob.pixelCount > minSize) blobs.push(blob);
                                }
                            }
                        }

                        totalBlobsFound += blobs.length;

                        if (blobs.length > 1) {
                            const centers = blobs.map(blob => ({
                                x: (blob.minX + blob.maxX) / 2,
                                y: (blob.minY + blob.maxY) / 2
                            }));

                            const sortedDots = sortNearestNeighbor(centers);
                            const pathPoints = generateSmoothPoints(sortedDots, roundness);
                            
                            pathsToDraw.push({
                                dots: sortedDots,
                                pathPoints: pathPoints,
                                color: drawHex
                            });

                            // Add to SVG string
                            const pathData = getBezierPathData(sortedDots, roundness);
                            svgElements += `<path d="${pathData}" fill="none" stroke="${drawHex}" stroke-width="${lineThickness.value}" stroke-linecap="round" stroke-linejoin="round" opacity="${lineOpacity.value}" />`;
                        }
                    });

                    if (pathsToDraw.length > 0) {
                        lastSvgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}">${svgElements}</svg>`;

                        statusText.innerText = `Done! Found ${totalBlobsFound} total areas.`;
                        statusText.style.color = "#00ff00";
                        downloadGroup.classList.remove('hidden');
                        
                        if (animateToggle.checked) {
                            replayBtn.classList.remove('hidden');
                            startAnimation();
                        } else {
                            drawFrame(1);
                        }
                    } else {
                        statusText.innerText = "Found 0 areas. Try increasing tolerance or size.";
                        statusText.style.color = "#ff4444";
                        drawFrame(0);
                    }

                } catch (err) {
                    console.error(err);
                    statusText.innerText = "Error during processing.";
                    statusText.style.color = "#ff4444";
                } finally {
                    processBtn.disabled = false;
                }
            }, 50);
        });

        // --- Replay Button ---
        replayBtn.addEventListener('click', () => {
            if (pathsToDraw.length > 0) startAnimation();
        });

        // --- Downloads ---
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'color-constellation.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        svgBtn.addEventListener('click', () => {
            if (!lastSvgString) return;
            const blob = new Blob([lastSvgString], {type: "image/svg+xml"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'color-constellation.svg';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
