name: Test SubsPlease schedule access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch weekly schedule
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --user-agent 'AiringBoard-ScheduleCheck/1.0' \
            --output subsplease-schedule.json \
            'https://subsplease.org/api/?f=schedule&tz=Europe%2FBerlin'

      - name: Check JSON shape and timezone
        run: |
          jq -e '.tz == "Europe/Berlin" and (.schedule | type == "object") and ([.schedule[][]] | length > 0)' \
            subsplease-schedule.json > /dev/null
          jq -r '"Schedule OK: \([.schedule[][]] | length) entries, timezone \(.tz)"' \
            subsplease-schedule.json

      - name: Preserve response as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsplease-schedule-test
          path: subsplease-schedule.json
          retention-days: 7
