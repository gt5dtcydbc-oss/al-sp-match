<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Draggable Image Canvas</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: #0a0c11;
    /* fallback gradient — replaced by images/bg.* when found */
    background-image: radial-gradient(circle at 50% 25%, #1c2230, #0a0c11 70%);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .draggable {
    position: fixed;
    top: 0;
    left: 0;
    border-radius: 12px;
    object-fit: cover;           /* dimension == natural ratio → no visible crop */
    cursor: grab;
    touch-action: none;
    -webkit-user-drag: none;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
    opacity: 0;
    transition: opacity 0.6s ease, box-shadow 0.2s ease;
  }

  .draggable:hover {
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(120, 190, 255, 0.5);
  }

  .draggable.dragging {
    cursor: grabbing;
    box-shadow: 0 22px 52px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(120, 190, 255, 0.9);
    transition: box-shadow 0.15s ease;
  }
</style>
</head>
<body>

<script>
(() => {
  "use strict";

  /* ================================================================
     CONFIG
     ================================================================ */
  const CONFIG = {
    folder: "images/",              // relative → works on project pages too
    start: 1,
    end: 99,                        // raise to 999 for big galleries
    extensions: ["jpg", "jpeg", "png", "webp", "gif", "avif", "jxl"],
    maxConsecutiveMisses: 5,
    batchSize: 6,

    // ---- sizing (aspect-ratio preserved) ----
    targetCoverage: 0.35,           // share of viewport covered by all tiles
    minSize: 40,                    // px floor on the short edge
    maxSizeRatio: 0.45,             // max long edge = ratio × min(W, H)
    overlap: 0.35,                  // jitter past the cell, × tile size

    bgNames: ["bg"],
    bgScrim: 0.35                   // 0 = no overlay, 1 = black
  };

  /* ================================================================
     State
     ================================================================ */
  let topZ = 0;
  const elements = [];

  const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

  // Reflect out-of-range values instead of pinning them to the edge.
  function scatter(value, min, max) {
    if (max <= min) return min;
    const span = max - min;
    const period = span * 2;
    let v = (((value - min) % period) + period) % period;
    if (v > span) v = period - v;
    return v + min;
  }

  /* ================================================================
     File discovery
     ================================================================ */
  const imageUrl = (name, ext) => `${CONFIG.folder}${name}.${ext}`;

  function exists(url) {
    return fetch(url, { method: "HEAD" })
      .then(res => res.ok)
      .catch(() => existsViaImage(url));
  }

  function existsViaImage(url) {
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload = () => resolve(true);
      probe.onerror = () => resolve(false);
      probe.src = url;
    });
  }

  async function findFile(name) {
    const checks = await Promise.all(
      CONFIG.extensions.map(async ext => {
        const url = imageUrl(name, ext);
        return { url, ok: await exists(url) };
      })
    );
    const hit = checks.find(c => c.ok);
    return hit ? hit.url : null;
  }

  /* ================================================================
     Background: images/bg.(jpg|png|webp|…|jxl)
     ================================================================ */
  async function applyBackground() {
    for (const name of CONFIG.bgNames) {
      const url = await findFile(name);
      if (!url) continue;

      await new Promise(resolve => {
        const pre = new Image();
        pre.onload = pre.onerror = resolve;
        pre.src = url;
      });

      const scrim = clamp(CONFIG.bgScrim, 0, 1);
      const layers = [];

      if (scrim > 0) {
        layers.push(`linear-gradient(rgba(0,0,0,${scrim}), rgba(0,0,0,${scrim}))`);
      }
      layers.push(`url("${url}")`);
      layers.push(`radial-gradient(circle at 50% 25%, #1c2230, #0a0c11 70%)`);

      document.body.style.backgroundImage = layers.join(", ");
      document.body.style.backgroundSize = "cover, cover, cover";
      document.body.style.backgroundPosition = "center, center, center";
      document.body.style.backgroundRepeat = "no-repeat, no-repeat, no-repeat";
      return url;
    }
    return null;
  }

  /* ================================================================
     Numbered images: 1…N
     ================================================================ */
  async function discoverImages() {
    const found = [];
    let misses = 0;

    for (let start = CONFIG.start; start <= CONFIG.end; start += CONFIG.batchSize) {
      if (misses >= CONFIG.maxConsecutiveMisses) break;

      const numbers = [];
      for (let n = start; n < start + CONFIG.batchSize && n <= CONFIG.end; n++) {
        numbers.push(n);
      }

      const results = await Promise.all(
        numbers.map(async n => ({ n, url: await findFile(String(n)) }))
      );

      for (const { url } of results) {
        if (url) { found.push(url); misses = 0; }
        else misses++;
      }
    }
    return found;
  }

  /* ================================================================
     Preload (gives us natural dimensions), then build elements
     ================================================================ */
  function loadImage(src) {
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload = () => resolve({
        src,
        w: probe.naturalWidth,
        h: probe.naturalHeight
      });
      probe.onerror = () => resolve(null);   // undecodable (e.g. .jxl in Chrome)
      probe.src = src;
    });
  }

  async function createElements(urls) {
    const loaded = (await Promise.all(urls.map(loadImage))).filter(Boolean);

    loaded.forEach(({ src, w, h }) => {
      const img = document.createElement("img");
      img.className = "draggable";
      img.alt = "";
      img.draggable = false;
      img.dataset.ratio = String(w > 0 && h > 0 ? w / h : 1);
      img.style.zIndex = ++topZ;

      img.addEventListener("dragstart", e => e.preventDefault());
      makeDraggable(img);
      img.src = src;

      document.body.appendChild(img);
      elements.push(img);
    });
  }

  /* ================================================================
     Layout — equal-area sizing, aspect ratio preserved
     ================================================================ */
  function layout() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const n = elements.length;
    if (!n) return;

    const cols = Math.max(1, Math.min(n, Math.round(Math.sqrt((n * W) / H))));
    const rows = Math.ceil(n / cols);
    const cellW = W / cols;
    const cellH = H / rows;

    // Each tile gets the same share of the viewport, whatever its shape.
    const targetArea = (W * H * CONFIG.targetCoverage) / n;
    const maxLong = Math.min(W, H) * CONFIG.maxSizeRatio;

    elements.forEach((el, i) => {
      const ratio = parseFloat(el.dataset.ratio) || 1;

      // Equal-area solve: w·h = targetArea, w/h = ratio
      let w = Math.sqrt(targetArea * ratio);
      let h = Math.sqrt(targetArea / ratio);

      // Cap long edge so a few big images can't swamp the screen.
      const long = Math.max(w, h);
      if (long > maxLong) {
        const k = maxLong / long;
        w *= k; h *= k;
      }
      // Keep the short edge readable.
      const short = Math.min(w, h);
      if (short < CONFIG.minSize) {
        const k = CONFIG.minSize / short;
        w *= k; h *= k;
      }
      // Hard safety: never bigger than 90% of the viewport.
      if (w > W * 0.9) { const k = (W * 0.9) / w; w *= k; h *= k; }
      if (h > H * 0.9) { const k = (H * 0.9) / h; w *= k; h *= k; }

      el.style.width = Math.round(w) + "px";
      el.style.height = Math.round(h) + "px";

      const col = i % cols;
      const row = Math.floor(i / cols);

      // Symmetric jitter around the cell centre, extended by overlap.
      const spanX = Math.max(0, cellW - w) + w * CONFIG.overlap;
      const spanY = Math.max(0, cellH - h) + h * CONFIG.overlap;

      const cx = col * cellW + (cellW - w) / 2 + (Math.random() - 0.5) * spanX;
      const cy = row * cellH + (cellH - h) / 2 + (Math.random() - 0.5) * spanY;

      el.style.left = Math.round(scatter(cx, 0, Math.max(0, W - w))) + "px";
      el.style.top = Math.round(scatter(cy, 0, Math.max(0, H - h))) + "px";
    });

    elements.forEach((el, i) => {
      el.style.transitionDelay = i * 40 + "ms";
      requestAnimationFrame(() => (el.style.opacity = "1"));
      setTimeout(() => (el.style.transitionDelay = "0ms"), 400 + i * 40);
    });
  }

  /* ================================================================
     Drag logic (Pointer Events: mouse, touch, pen)
     ================================================================ */
  function makeDraggable(el) {
    let pointerId = null;
    let startX = 0, startY = 0, startLeft = 0, startTop = 0;

    el.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;

      pointerId = e.pointerId;
      el.setPointerCapture(pointerId);

      startX = e.clientX;
      startY = e.clientY;
      startLeft = parseFloat(el.style.left) || 0;
      startTop = parseFloat(el.style.top) || 0;

      el.style.zIndex = ++topZ;
      el.classList.add("dragging");
      e.preventDefault();
    });

    el.addEventListener("pointermove", e => {
      if (e.pointerId !== pointerId) return;

      const maxX = Math.max(0, window.innerWidth - el.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - el.offsetHeight);

      el.style.left = clamp(startLeft + (e.clientX - startX), 0, maxX) + "px";
      el.style.top = clamp(startTop + (e.clientY - startY), 0, maxY) + "px";
    });

    const stopDragging = e => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      if (el.hasPointerCapture(pointerId)) el.releasePointerCapture(pointerId);
      pointerId = null;
      el.classList.remove("dragging");
    };

    el.addEventListener("pointerup", stopDragging);
    el.addEventListener("pointercancel", stopDragging);
    el.addEventListener("lostpointercapture", () => {
      pointerId = null;
      el.classList.remove("dragging");
    });
  }

  /* ================================================================
     Keep tiles on screen on resize
     ================================================================ */
  window.addEventListener("resize", () => {
    elements.forEach(el => {
      const maxX = Math.max(0, window.innerWidth - el.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - el.offsetHeight);
      el.style.left = clamp(parseFloat(el.style.left) || 0, 0, maxX) + "px";
      el.style.top = clamp(parseFloat(el.style.top) || 0, 0, maxY) + "px";
    });
  });

  /* ================================================================
     Go
     ================================================================ */
  (async () => {
    const [, urls] = await Promise.all([applyBackground(), discoverImages()]);

    if (!urls.length) {
      console.warn("[canvas] No images found in", CONFIG.folder);
      return;
    }

    await createElements(urls);
    if (!elements.length) {
      console.warn("[canvas] Files found but none could be decoded");
      return;
    }
    layout();
  })();
})();
</script>
</body>
</html>
